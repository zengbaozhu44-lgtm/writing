core_conflict: |-
  周一，林守常打开店门时，发现门槛内侧躺着一片枯叶。梧桐的。这条巷子里没有梧桐，秋天也还没到。他弯腰捡起来，对着光看了看叶脉，把它夹进了柜台上一本积灰的书里。那本书叫《植物名实图考》，卖了七年，始终没人买走。
  "目录"从抽屉里探出头，聋了的耳朵抖了抖，又缩了回去。
  煤炉是昨天夜里熄的。他蹲下去，重新引火，动作很慢，像是在拖延什么。
stakes: 在倒闭前的一周里，为每位常客找到一本真正需要的书，完成自己与世界的漫长告别
escalation_phases:
  - chapter: 1
    tone: 沉缓、温热、两个老男人的告别仪式。时间像糨糊一样黏稠，对话带文言气，但绝不过度
    event: 老周归还借了三年的《陶庵梦忆》，书脊脱胶。两人为「修不修旧书」产生表面分歧，林守常沉默地修好；老周留下一个橘子。
    ending: 老周离开后，林守常把橘子剥了，一瓣放在「目录」食盆里，一瓣自己吃了，其余用报纸包好塞进抽屉。他取出早上那片来历不明的枯叶，夹进刚修好的《陶庵梦忆》「湖心亭看雪」那一页。关门时，他用缺了半截的中指摸了摸门框上的一颗旧钉子——那里曾经挂着「今日营业」的木牌，牌已经不在了。
  - chapter: 2
    tone: 轻快与滞涩交织。少年人假装成熟的语速，与突然失速的停顿。阳光比昨天更烈，但书店里更暗。
    event: 小满来卖一套《哈利·波特》，声称「不稀罕了」。林守常发现扉页有她 2015 年的铅笔字，知道她在撒谎（需要钱）。他按原价收了书，多塞一本《挪威的森林》。
    ending: 小满抱着两本书跑出门，在门槛处绊了一下，没回头。林守常没追出去，只是蹲下去，把周二早上被她蹭歪的那块地砖又踩平了一次。他回到柜台，拉开抽屉，从一沓旧借阅卡中抽出一张「小满 2015.6」，和今天的收书单夹在一起。「目录」在抽屉里翻了个身，尾巴扫过那张卡片。
  - chapter: 3
    tone: 近乎默片。时间的液态感。极轻的动作，极短的呼吸，阳光在灰尘里缓慢移动
    event: 阿婆如常来店里，不买东西，只坐在角落那把缺腿的椅子上晒太阳。临走时，她留下一个洗干净的橘子（没有塑料袋，用一块旧手帕包着）。林守常回赠一本缺页的《繁星·春水》。两人全程几乎没有对话。
    ending: 阿婆走后，林守常发现橘子下面垫着的那块旧手帕上绣着一个模糊的「周」字（老周妻子多年前遗落之物，不点破）。他把橘子放在煤炉边烤热，剥开，一瓣一瓣摆在窗台上晾着。他坐在阿婆坐过的那把缺腿椅子上，从脚下抽出一物垫在椅腿下——正是周二小满蹭歪、被他踩平的那块地砖。他坐了很久，直到煤炉的光把橘子的影子投在墙上，形状像一只弓着背的猫。
