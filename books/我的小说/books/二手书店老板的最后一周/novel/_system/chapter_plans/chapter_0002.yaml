  - 场景2（受阻与博弈）：林守常发现扉页有她 2015 年的铅笔字，知道她在撒谎（需要钱）——真正的话没说出口，一个动作代替了它。
  - 场景3（收束）：小满抱着两本书跑出门，在门槛处绊了一下，没回头。林守常没追出去，只是蹲下去，把周二早上被她蹭歪的那块地砖又踩平了一次。他回到柜台，拉开抽屉，从一沓旧借阅卡中抽出一张「小满 2015.6」，和今天的收书单夹在一起。「目录」在抽屉里翻了个身，尾巴扫过那张卡片。
emotional_beat: 从开篇的滞涩与微疑，到中段的温柔角力，再到收束时一个静默动作的落定，最后落在一丝悬而未决的凉意上——像煤炉将熄未熄时那一点暗红的光。（本章情绪线：轻快与滞涩交织。少年人假装成熟的语速，与突然失速的停顿。阳光比昨天更烈，但书店里更暗。）
