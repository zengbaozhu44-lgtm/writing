chapter: 2
goal: 轻快与滞涩交织。少年人假装成熟的语速，与突然失速的停顿。阳光比昨天更烈，但书店里更暗。小满来卖一套《哈利·波特》，声称「不稀罕了」。林守常发现扉页有她 2015 年的铅笔字，知道她在撒谎（需要钱）。他按原价收了书，多塞一本《挪威的森林》。本章的折痕是一个被咽回去的句子：有人看破不说破，有人用一个体面的借口维持处境。上章末，关门后，门缝下被塞进一张纸片，上面用铅笔写着两个字：等你——这些悬在心头的事，还没有被回答。本章须为「阿婆手帕上的周字浮现老周妻子的遗物连接」完成情感前置。对悬而未决的悬念只推进、不解答——用物证与质感加深悬疑，绝不给答案。POV 林守常——只写他看见的与咽回去的，不写答案。
conflict: 表面冲突是「小满来卖一套《哈利·波特》，声称不稀罕了。林守常发现扉页有她 2015 年的铅笔字，知道她在撒谎需要钱。他按原价收了书，多塞一本《挪威的森林》。」。真正的冲突不在动作，而在没说出口的话：一方不肯承认自己的窘迫，另一方不肯戳穿这个谎。若本章没有这样一个「被咽回去的句子」作折痕，场景就只是日常流水账——写作时让每一个停顿都压着话。
climax: 小满抱着两本书跑出门，在门槛处绊了一下，没回头。林守常没追出去，只是蹲下去，把周二早上被她蹭歪的那块地砖又踩平了一次。他回到柜台，拉开抽屉，从一沓旧借阅卡中抽出一张「小满 2015.6」，和今天的收书单夹在一起。「目录」在抽屉里翻了个身，尾巴扫过那张卡片。
cost: 他接下了一桩不该接的交易，也接住了一个不愿被点破的谎——他在用「多做一点、多给一分」的方式替对方的体面买单，代价是他越来越熟练地接受「告别不必被说出来」。真正的损失不在钱，在每一次被咽回去的话、每一块被再次踩平的地砖。
hook: 「目录」在抽屉里翻了个身，尾巴扫过那张卡片。他盯着那张卡看了两秒——卡缘微微卷着，像被压在某本书里很多年。他没有把它放回原处，只把抽屉推上。
