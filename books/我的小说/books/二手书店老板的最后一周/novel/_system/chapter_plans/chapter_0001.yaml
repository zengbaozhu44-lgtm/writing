chapter: 1
goal: 【主线推进】 沉缓、温热、两个老男人的告别仪式。时间像糨糊一样黏稠，对话带文言气，但绝不过度。老周归还借了三年的《陶庵梦忆》，书脊脱胶。两人为「修不修旧书」产生表面分歧，林守常沉默地修好；老周留下一个橘子。本章的折痕是一个被咽回去的句子：有人看破不说破，有人用一个体面的借口维持处境。本章须为「阿婆手帕上的周字浮现老周妻子的遗物连接」完成情感前置。对悬而未决的悬念只推进、不解答——用物证与质感加深悬疑，绝不给答案。POV 林守常——只写他看见的与咽回去的，不写答案。
conflict: 表面冲突是「老周归还借了三年的《陶庵梦忆》，书脊脱胶。两人为修不修旧书产生表面分歧，林守常沉默地修好；老周留下一个橘子。」。真正的冲突不在动作，而在没说出口的话：一方不肯承认自己的窘迫，另一方不肯戳穿这个谎。若本章没有这样一个「被咽回去的句子」作折痕，场景就只是日常流水账——写作时让每一个停顿都压着话。
climax: 老周离开后，林守常把橘子剥了，一瓣放在「目录」食盆里，一瓣自己吃了，其余用报纸包好塞进抽屉。他取出早上那片来历不明的枯叶，夹进刚修好的《陶庵梦忆》「湖心亭看雪」那一页。关门时，他用缺了半截的中指摸了摸门框上的一颗旧钉子——那里曾经挂着「今日营业」的木牌，牌已经不在了。
cost: "【角色代价: 失去之物】他接住的不是一件买卖，是一个不肯说出口的处境——他用「多做一点、多给一分」的方式替对方的体面买单，代价是他越来越熟练地接受「告别不必被说出来」。真正的损失不在钱，在每一次被咽回去的话、每一件被轻轻放下又收进抽屉的橘子。"
hook: "【钩子类型: 认知缺口】关门时，他用缺了半截的中指摸了摸门框上的一颗旧钉子——那里曾经挂着「今日营业」的木牌，牌已经不在了。他站在门口，往门槛内侧看了一眼——什么也没有。那片叶子，不知道还会不会有人放回来。"
scenes:
  - 场景1：清晨开门——林守常发现门槛内侧躺着一片梧桐叶，夹进《植物名实图考》。引燃煤炉，'目录'从抽屉探头。时间像糨糊一样黏稠。
  - 场景2：老周还书——老周归还借了三年的《陶庵梦忆》，书脊脱胶。两人关于'修不修旧书'的争执与沉默。林守常修好书。老周留一个橘子。
  - 场景3：独处与收束——老周已离开，本场景他不会出现，禁止再写他本人/还书争执/修书/背影/脚步声/巷口。他独自坐在柜台后，剥开橘子，一瓣给猫，一瓣自己吃，余的用报纸包好。取出枯叶，夹进《陶庵梦忆》。关门时摸门框上那枚旧钉子。门缝下塞出写有「等你」的纸片。
emotional_beat: 从开篇的滞涩与微疑，到中段的温柔角力，再到收束时一个静默动作的落定，最后落在一丝悬而未决的凉意上——像煤炉将熄未熄时那一点暗红的光。（本章情绪线：沉缓、温热、两个老男人的告别仪式。时间像糨糊一样黏稠，对话带文言气，但绝不过度）
