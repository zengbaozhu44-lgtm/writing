# 场景环境配置 —— Studio Beat 生成时按 (chapter, scene) 提取「环境触发器」
# 只存可感知的静态环境（角色、剧情、时间轴不在此文件）。
# 键格式：ch{章}_scene{场景序号}；environment 四感，供 extractEnvTrigger 按键词提取当前拍片段。
scenes:
  ch1_scene1:
    setting: 周一清晨，天未全亮，书店还没开门，煤炉一夜未燃，铁皮是凉的。
    environment:
      visual: 天未全亮的灰蓝、门槛内侧那片梧桐叶、柜台的浮尘、抽屉半开的缝。
      tactile: 门闩铁器的凉、梧桐叶薄脆的触感、书页的粗涩、煤炉铁皮的冷。
      olfactory: 一夜封存的霉味与纸灰气、煤炉引燃前的铁锈味。
      auditory: 卷帘门闩的响动、巷口第一声猫叫、煤块碰炉壁的轻响。
  ch1_scene2:
    setting: 午后，老周带着还了三年未还的《陶庵梦忆》进店，阳光斜斜照在柜台上。
    environment:
      visual: 柜台上的《陶庵梦忆》、书脊裂开的胶痕、老周放下的那只橘子、午后斜进店里的光。
      tactile: 脱胶书脊在指间的松动、书页发脆的涩、橘子光滑的皮。
      olfactory: 旧书的霉香、老周身上的烟草味、浆糊的气味。
      auditory: 老周翻书的沙沙声、门轴吱呀、街上的车铃声。
  ch1_scene3:
    setting: 傍晚的二手书店，老周已离开，煤炉将熄，柜台上留着一只橘子。
    environment:
      visual: 炉膛暗红将熄的煤火、柜台上那只橘子、门框上生锈的旧钉子、缺了一角的《陶庵梦忆》。
      tactile: 塑封书皮冰凉的触感、橘皮粗粝的凉、木屑灰蹭在指腹、纸页边缘卷曲的涩。
      olfactory: 煤炉的灰烬味、旧书的霉香、橘皮的辛涩。
      auditory: 巷口的猫叫、煤块在炉膛里剥落的轻响、门轴吱呀、街上渐远的脚步声。
