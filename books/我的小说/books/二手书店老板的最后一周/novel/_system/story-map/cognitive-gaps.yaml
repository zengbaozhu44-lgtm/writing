    expected_reveal_ch: 未定
    resolve_condition: 作者决定投递者与揭示章
    author_note: >-
      这是 09 任务卡钦定的第 1 章新增伏笔，但没有任何回收计划。候选：林薇遗物 /
      旧页同盟 / 周岚 / 未来的某位读者。与「从书里来」线索搭配后，很可能是贯穿卷 1
      的情书式悬念——请作者定夺。

  - id: gap_003
