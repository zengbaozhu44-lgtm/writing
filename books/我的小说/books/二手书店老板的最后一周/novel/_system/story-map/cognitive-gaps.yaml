    type: identity
    urgency: high
    status: open
    opened_ch: ch_0001
    opened_by: 周一开门，门槛内侧出现断口齐整如刀切的梧桐叶（巷子里没有梧桐，秋天也还没到）
    reader_question: 「那片叶子到底什么意思？」——story_dna 追更动力第 2 条
    source: km_001
    foreshadowing_ref: H001
    related_thread: main_core
    sub_gaps: []
    expected_reveal_ch: 未定
    resolve_condition: 作者决定投放者身份并安排揭示场景
    author_note: >-
      卷 1 大纲只回收了叶子的「去向」（ch8 烘烤 → ch10 作钥匙），没有回收「投放者」。
      草稿堆叠里出现了「去年林薇夹在《聊斋》里的那片」「叶心米粒是去年除夕林薇包饺子
      蹭上去的」这类揭示，但 vol_01 未收录——是否把叶子链到林薇、在卷 1 或卷 2 揭示，
      请作者拍板。ch1 结束时林守常不知道投放者，系统不应替作者编造答案。

