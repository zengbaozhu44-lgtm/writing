    type: truth
    urgency: medium
    status: open
    opened_ch: ch_0001
    opened_by: 老周说老伴儿让他还《浮生六记》→ 林守常点破「你压根没借过」；老周说「下周日店拆了回老家」「这些书你留着，别修了」
    reader_question: 老周为什么撒谎？他儿子的线（「这书我儿子也读过」）去哪了？
    source: km_002
    foreshadowing_ref: H003
    related_thread: sub_laozhou
    sub_gaps:
      - id: gap_003a
