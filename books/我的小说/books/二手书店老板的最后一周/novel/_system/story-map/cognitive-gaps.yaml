    opened_by: 第 1 章钩子：关门后门缝塞入铅笔字纸片「等你」，无署名，边缘卷曲，像被夹在某本书里很久了
    reader_question: 「今天谁来？」的变体——谁在留信？为什么是「等你」？
    source: km_007
    foreshadowing_ref: H002
    related_thread: main_core
    sub_gaps:
