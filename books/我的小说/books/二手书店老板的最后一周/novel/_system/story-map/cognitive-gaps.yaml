# ---------------------------------------------------------------------------
# draft_only 决策记录（2026-08-13 · P0 收尾）
# 以下元素只出现在 ch1 正文的草稿堆叠中，未进入 vol_01 大纲 / 09 任务卡。
# 默认决策：cut 4 项 / resolve 1 项。作者可 veto 任意一项（改回 promote）。
# 决策后正典 = 只认 vol_01 大纲 + 09 任务卡 + 本账本 gaps。
# ---------------------------------------------------------------------------
draft_only_decisions:
  - id: draft_001
    element: 石阶上落下一粒铜纽扣，沾着干涸暗色，凑近有铁锈味
    decision: cut
    reason: 大纲无此物，第 1 章信息已足（叶/橘/纸片/照片/谎言五线同开）；若后续想让「塞纸片的人留下痕迹」，可再 promote 为 gap_009。
  - id: draft_002
    element: 关门时门板内侧一枚凸起的铁钉，「昨天还没有」
    decision: cut
    reason: 与正典结尾「摸门框旧钉子（挂『今日营业』木牌）」冲突，大纲无此物；新钉细节留待卷 2 如需「有人动过门」时再用。
  - id: draft_003
    element: 「目录」开口说话（「那片叶子，是去年林薇夹在《聊斋》里的那片」）
    decision: cut
    reason: 猫开口违反该书现实主义基调；正典中「林薇与叶子」的信息由 gap_005 通过物证（照片/橘子络/米粒）渐进释放，不让猫泄底。
  - id: draft_004
    element: 阿婆在 ch1 出场（用糨糊瓶压账本、摸叶发现胶痕）
    decision: cut
    reason: vol_01 大纲阿婆 ch3 才入场；ch1 出现阿婆是 POV/时序错乱源之一（已配合修复 chapter_0001.yaml 的 pov 阿婆→林守常）。
  - id: draft_005
    element: 枯叶夹入位置在草稿间互相矛盾（《植物名实图考》13 页 / 214 页 vs《陶庵梦忆》湖心亭看雪页）
    decision: resolve
    reason: 定案正典——林守常清晨拾起时夹进《植物名实图考》（柜台积灰那本）；老周走后、剥橘喂猫后，把枯叶移入修好的《陶庵梦忆》「湖心亭看雪」页。此后该叶所在页即卷 1 追踪点。
