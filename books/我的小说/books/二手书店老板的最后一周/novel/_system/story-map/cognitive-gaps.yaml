# ============================================================================
# 认知缺口账本 · Cognitive Gap Ledger
# ----------------------------------------------------------------------------
# 书：二手书店老板的最后一周 ｜ 账本记录点：ch_0001 之后 ｜ 卷：1
#
# 定位：作者视角的「读者心里悬着什么」清单，P0 缺口网络的持久源。
# 它回答的不是「故事讲了什么」，而是「哪些问题读者还没得到答案、作者还没做决定」。
#
# ★ 与现有系统的统一规则（重要）：
#   1) 信息差 = `novel/06_knowledge_matrix.yaml` 的行
#      → 每个缺口用 `source: km_00X` 指向那里（缺口 = 读者还不知道的信息差）。
#   2) 伏笔 = `novel/12_foreshadow_db.yaml` 的 hooks
#      → 每个缺口用 `foreshadowing_ref: H###` 指向那里（缺口闭合 = 伏笔回收）。
#   3) 支线 = `novel/_system/story-map/plot-threads.yaml`
#      → 每个缺口用 `related_thread` 挂到承载它的支线卡片上。
#   4) 模型真正「看得见」的活通道 = `novel/07_state_board.md`
#      → prompt-compiler 把 07 注入「局势」区块。status=open 且 urgency=high 的
#        缺口必须同步出现在 07，否则模型感知不到（伏笔库目前是只写不读的）。
#
# 维护约定：每章 accept 后更新 status / expected_reveal / author_note。
#   系统 commit 不会写本文件（不在 git-memory 的 NOVEL_TRACKED 白名单，纯作者侧）。
#   状态机：open → touched(有进展未解决) → resolved / cut(作者弃置)；
#           draft_only(只出现在草稿堆叠中，作者决定 promote 或删除)。
#   对齐：urgency=high 的缺口应支撑 story_dna 的追更动力（「那片叶子到底什么意思？」…）
# ============================================================================

meta:
  book: 二手书店老板的最后一周
  ledger_after: ch_0001
  volume: 1
  status_machine: open | touched | resolved | cut | draft_only

gaps:
  - id: gap_001
