        note: ch1 一句「这书，我儿子也读过」提起后再无下文；vol_01 未回收。断线或留白，请作者定。
    expected_reveal_ch: vol_01_ch_10（还书离城）
    resolve_condition: 作者决定谎言动机与儿子线去留
    author_note: >-
