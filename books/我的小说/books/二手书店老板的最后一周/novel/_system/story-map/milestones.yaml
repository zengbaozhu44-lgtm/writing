milestones:
  - id: m1
    chapter: 3
    event: 阿婆手帕上的「周」字浮现（老周妻子的遗物连接）
    setup_chapters:
      - 1
      - 2
    must_have:
      - 阿婆用旧手帕包橘子留下，林守常回赠缺页《繁星·春水》
      - 手帕上绣着模糊的「周」字被林守常注意到，但不点破
      - 烤橘子的影子投在墙上，像一只弓背的猫（「目录」的映照）
    emotional_requirement: 默片式的温存里落下一道不响的惊雷——「周」字让读者意识到店里每个人都被旧时间绑着
    failure_if_missing:
      - 若第3章没有「周」字线索，阿婆线只是日常，卷1人际暗网失去第一个节点
  - id: m2
    chapter: 5
    event: 夜行者偷书被戳穿「那本不是你的」（外部压力第一次正面交锋）
    setup_chapters:
      - 4
    must_have:
      - 拆迁公告是ch4贴出后仍活着的背景压力
      - 无名夜行者深夜潜入，被「目录」的叫声惊动
      - 夜行者翻到《几何原本》扉页批注「证明完毕，人生无解」并愣住
      - 林守常不开灯从柜台后说「那本不是你的」；夜行者留下干瘪橘子离开
    emotional_requirement: 静夜里的对峙，双方各退一步——恐惧与善意同时落地
    failure_if_missing:
      - 若第5章没有夜行者正面交锋，外部压力仍是纸上的公告，卷1中段缺乏实体冲突
  - id: m3
    chapter: 7
    event: 借阅卡「周岚·1987」滑落（周岚与书店前史的核心真相浮现）
    setup_chapters:
      - 6
    must_have:
      - 阿婆翻找《苔丝》时失手打翻书架，褪色借阅卡滑落
      - 借阅卡上「周岚·1987」的字样出现（读者视角看到）
      - 呼应ch6周岚自曝「年轻时偷过一本忘了书名的书」（指向《局外人》）
    emotional_requirement: 一张旧卡让收购者的人设塌方——他不是来拆店的，是来认领的
    failure_if_missing:
      - 若第7章借阅卡没有落地，周岚的「体面收购」只是反派工具，卷1情感动机缺失
  - id: m4
    chapter: 10
    event: 钥匙置门槛·枯叶压合同·三个橘子（卷终谢幕）
    setup_chapters:
      - 8
      - 9
    must_have:
      - 枯叶放在周岚带来的合同上
      - 林守常抱起「目录」，把钥匙放在门槛内侧，走进书架深处
      - 三个橘子分放门槛/藤椅/柜台（老周归还之谢、阿婆等待之念、自我告别之味）
      - 摊开的《植物名实图考》书页间压着借阅卡「周岚·1987·《局外人》」，背面是铅笔字「有些书不是用来读的，是用来等你回来认领的」
    emotional_requirement: 空店留白，门外的机械声与门内的三橘——毁灭与新生同框
    failure_if_missing:
      - 若第10章没有钥匙+枯叶+三橘的收束，卷1结尾没有「遗物感」，卷2无法接续
