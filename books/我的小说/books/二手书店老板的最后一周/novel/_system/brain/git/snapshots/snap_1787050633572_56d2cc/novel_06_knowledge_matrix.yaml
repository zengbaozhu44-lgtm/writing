# 06 Knowledge Matrix — 谁知道什么
# 级别: know | partial | unknown
# 说明：这是 LIVE 数据——prompt-compiler 把它注入「信息差 TopK」区块。
#   每行 `id`（km_00X）与 cognitive-gaps.yaml 的 `source` 对齐（统一反链）。
#   POV（林守常）每行必含，保证被 filterKnowledge 选中。
#   ch_0001 后的快照：level 表示「第 1 章末」各角色实际知道的程度。
#
# 协议化扩展（IRP v0.1 · 见 docs/inkos-intent-rendering-protocol-v0.1.md）：
#   每行追加三个书级 bookkeeping 字段（compiler 只读行内角色 level，忽略额外字段）：
#     reader_knows     —— 读者此刻知道的程度（know | partial | unknown）
#     urgency          —— 该信息差的热度（low | medium | high），与认知缺口账本一致
#     expected_reveal  —— 预计揭示章（对齐 cognitive-gaps.yaml 的 expected_reveal_ch）
#   这些字段供意图渲染器 / 情境化评分器读取，驱动「推进 vs 不解答」的节奏决策。

