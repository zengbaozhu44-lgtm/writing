# 卷基调配置（IRP v0.1 · 渲染器按卷读取）
# ----------------------------------------------------------------------------
# 定位：costTypePrefix 的「卷级默认值」+ 情绪基线。渲染器在生成 chapter_NNNN.yaml 时，
#   先解析当前章属于哪个 vol_NNN.md（10_volume_outline 下「含本章」的文件），再读本文件
#   对应卷的配置，作为该卷所有章【角色代价】前缀的默认值。换卷只改本文件，不改代码。
#
# 注意：与 novel/_system/wizard_chapter_tones.json 互不干扰——那是 Studio 向导的逐章
#   UI 配置（会被向导重写），本文件是卷级基调的权威源（作者意图）。
#
# 命中顺序（chapter 信号 > 卷级默认 > 全局兜底，实现在 costTypePrefix）：
#   1. 本章 event/ending 命中  谎|咽|说不出口   → 【角色代价: 咽回的话】
#   2. 命中                    暴露|戳穿        → 【角色代价: 身份暴露】
#   3. 命中                    失去|关门|离开   → 【角色代价: 失去之物】
#   4. 都未命中 → 取本卷 cost_prefix（下面对应卷块）
#   5. 卷配置缺失 → 全局兜底 【角色代价: 咽回的话】
# ----------------------------------------------------------------------------
volume_01:
  cost_prefix: 咽回的话
  emotion_baseline: 压抑

