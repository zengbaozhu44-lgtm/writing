pitch: 世界每天凌晨四点重置。林夜是少数带着记忆醒来的人——他渐渐发现，自己并不是第一个，也不会是最后一个。
genre: 科幻悬疑
core_hook: 世界每天凌晨四点重置，只有少数人记得；林夜在循环中追查重置者，并发现自己已经死亡多次。
protagonist: 林夜
reader: 16-30岁网文读者，喜欢高概念悬疑、快节奏反转、人物代价与打脸爽点
commercial_direction: 付费连载；主打追问升级、人物非理性选择、章末强 Hook
estimated_length: 150-250万字长篇连载
main_conflict: 效率重置系统 vs 带着记忆反抗的人；真正敌人是可被改写的集体记忆与「谁有权重置」
main_question: 谁在重置世界？林夜为什么记得？他是唯一被选中的人，还是第37次失败的幸存者？
power_fantasy: 记忆成为唯一资源；每一次存活都能换到别人没有的信息差与行动窗口
ending_direction: 林夜拒绝成为新的重置者；规则裂隙被打开，世界进入不稳定态，读者带着更大谜团追更
theme: 当世界可以被重置，人还剩下什么不能被抹去的东西？
audience: 喜欢《开端》《从前有座灵剑山》悬疑向、都市异能快节奏的读者
title: 时间重置者
updatedAt: 2026-07-15T03:53:00.000Z
