character: 陈默
goals:
  surface: 打破每日凌晨四点的世界重置循环，找出刷新背后的真相
  hidden: 确认自己第一次循环中亲友死亡的真相，证明人性仍有价值，避免自己沦为系统的一部分
fears:
  - 自己正在成为系统的一部分，失去人性
  - 真相揭示后发现自己才是‘错误’的一方
  - 每一次循环中建立的关系都会消失，永远孤独
bottom_line: 不会为了破解循环而故意伤害无辜者，即使利用预知能力也会尽量最小化他人痛苦
