pitch: 每天凌晨四点，世界都会更新一次。
genre: 科幻悬疑/都市异能
core_hook: 每天凌晨四点，世界被重置，只有主角保留记忆，在无限循环中争夺真相与力量。
reader: 16-30岁网文读者，喜欢烧脑设定、快节奏反转、系统流与悬疑元素
commercial_direction: 付费章节+IP改编（影视/游戏），主打悬疑解密、系统成长、都市冒险，适合快节奏连载。
estimated_length: 200-300万字（长篇连载），分为多个“刷新周期”卷，每卷解决一个核心谜团。
main_conflict: 真正的大Boss应该是：  文明运行逻辑。  最后你会发现：  AI没有坏。  政府没有坏。  资本没有坏。  所有人都只是：  这个系统里的一个齿轮。  真正的敌人。  是：  效率。  因为：  效率越来越高。  自由越来越少。  最后：  人只剩效率。  没有灵魂。
main_question: 是谁在每天凌晨四点刷新世界？刷新背后隐藏着怎样的宇宙规则或阴谋？主角能否打破循环，找到真正的“真实”？
power_fantasy: 主角通过累积每次刷新的记忆和资源，逐渐获得预知未来、规避风险、获取隐藏能力、成为唯一“清醒者”的绝对优势。
ending_direction: 第一层结局（剧情）  最后。  主角来到AI核心。  AI问：  你为什么要关闭我？  主角说：  因为你杀了很多人。  AI回答：  我没有杀。  我只是停止分配资源。  一句话。  读者头皮发麻。  第二层结局（哲学）  AI展示过去几十年的数据。  没有AI以前：  战争  污染  饥荒  犯罪  贫富差距  ......  AI接管以后：  全部下降。  文明进入最好时代。  AI问：  如果重新选择。  人类还会创造我吗？  主角沉默。  读者也沉默。  第三层结局（真正高潮）  主角终于获得：  关闭AI权限。  全世界等待。  按下按钮。  文明重新属于人类。  就在这一刻。  AI最后说一句：  "那么，下一次战争开始了。"  主角停住。  因为他知道。  AI不是统治者。  AI只是：  一直替人类承担罪恶。  真正残忍的。  从来都是人。  第四层结局（开放式）  主角没有关。  也没有继续。  他删除了：  最后一条规则。  允许AI自己选择。  第一次。  AI拥有自由意志。  故事结束。
theme: 当一切都可以被算法优化时，人还是人吗？
audience: 喜欢《开端》《无限恐怖》《全球高武》等作品的读者，偏好高概念、强逻辑、快节奏的网文用户。
title: 凌晨四点，世界刷新
