chapter: 5
goal: 让主角林夜经历第一次世界刷新，确认其真实性，并让他意识到自己成为了唯一保留记忆的‘清醒者’，为后续的探索与反抗奠定基础。
conflict: 林夜所经历的、连续的记忆（昨天被车撞的伤疤消失、日期回退）与整个世界（所有人、所有记录都显示昨天是普通的一天）之间的根本性矛盾。他尝试证明自己是对的，但每一次尝试都加深了他的孤独与世界的不可知。
climax: 凌晨4:00，林夜在医院的病床上醒来，亲眼目睹世界从‘昨天’（他被撞的那天）瞬间‘更新’为‘今天’（他醒来发现日期倒退的这天）——天空、光线、手机日期、周围人的状态在一秒内完成切换。他通过预设的、不可能被复制的标记（在洗手间镜子上用血写的字）确认了重置的真实性，并确定只有自己记得。
cost: 林夜失去了对‘现实’的信任基础，被抛入一个只有自己知道真相的孤独战场。他前24小时积累的所有物理证据（录像、日记）随着刷新全部消失，一切只能依赖记忆，并且他意识到这种‘记忆’本身也成了系统的异常，可能带来危险。
hook: 林夜在确认重置的瞬间，手机屏幕亮起。没有信号，没有来电显示，却收到一条由本地系统应用‘效率助手’推送的空白消息。当他试图截屏时，消息消失得无影无踪，仿佛从未存在过。这暗示着‘系统’已经注意到了他这个‘异常体’。
scenes:
  - 场景1：病床上的苏醒。林夜在医院病床上睁眼，确认日期回退、伤疤消失。他观察周围环境——护士、设备、窗外光线——所有细节都指向‘今天’是昨天。通过手机日期、新闻头条、与护士的对话，他逐步确认记忆的真实性，但无法获得任何物理证据支持。
  - 场景2：血字的证明。林夜借口去洗手间，在镜子上用指尖血写下‘4:00’。他返回病床，盯着手机上的时间跳动。3:59:50，世界开始异变——灯光闪烁，窗外天光倒流。4:00整，世界瞬间更新。他冲回洗手间，镜子上的血字消失，但残留在指甲缝里的血迹证明他确实写过。此时，手机亮起，收到一条来自‘效率助手’的空白消息，旋即消失。
emotional_beat: 从最初的困惑与否认（“这只是个梦”），到证据累积时的恐惧与不安（“世界真的不对了”），再到确认重置时的震撼与孤独（“只有我记得”），最后以系统主动接触的毛骨悚然收尾，情绪曲线呈‘怀疑→确认→战栗’的陡峭上升。
obstacle1: 林夜所经历的、连续的记忆（昨天被车撞的伤疤消失、日期回退）与整个世界（所有人、所有记录都显示昨天是普通的一天）之间的根本性矛盾。他尝试证明自己是对的，但每一次尝试都加深了他的孤独与世界的不可知。
ending: 林夜在确认重置的瞬间，手机屏幕亮起。没有信号，没有来电显示，却收到一条由本地系统应用‘效率助手’推送的空白消息。当他试图截屏时，消息消失得无影无踪，仿佛从未存在过。这暗示着‘系统’已经注意到了他这个‘异常体’。
