chapter: 1
goal: 让主角林夜经历第一次世界刷新，确认其真实性，并让他意识到自己成为了唯一保留记忆的‘清醒者’，为后续的探索与反抗奠定基础。
conflict: 主角林夜所经历的、连续的记忆（昨天被车撞的伤疤消失、日期回退）与整个世界（所有人、所有记录都显示昨天是普通的一天）之间的根本性矛盾。他尝试证明自己是对的，但每一次尝试都加深了他的孤独与世界的不可知。
climax: 凌晨4:00，林夜在医院的病床上醒来，亲眼目睹世界从‘昨天’（他被撞的那天）瞬间‘更新’为‘今天’（他醒来发现日期倒退的这天）——天空、光线、手机日期、周围人的状态在一秒内完成切换。他通过预设的、不可能被复制的标记（在洗手间镜子上用血写的字）确认了重置的真实性，并确定只有自己记得。
cost: 林夜失去了对‘现实’的信任基础，被抛入一个只有自己知道真相的孤独战场。他前24小时积累的所有物理证据（录像、日记）随着刷新全部消失，一切只能依赖记忆，并且他意识到这种‘记忆’本身也成了系统的异常，可能带来危险。
hook: 林夜在确认重置的瞬间，手机屏幕亮起。没有信号，没有来电显示，却收到一条由本地系统应用‘效率助手’推送的空白消息。当他试图截屏时，消息消失得无影无踪，仿佛从未存在过。这暗示着‘系统’已经注意到了他这个‘异常体’。
scenes:
  - 1. 凌晨4:00的惊醒：林夜在出租屋中因剧烈的偏头痛惊醒，发现手机日期显示为10月27日，而他清晰地记得昨天是10月28日。他身上的伤疤（昨天被车撞）也完全消失，陷入混乱与自我怀疑。
  - 2. 世界的否认：白天，林夜试图向同事、朋友、甚至交通警察证明昨天（10月28日）的存在，但所有人都对‘昨天’发生的事（包括他出车祸）毫无记忆，所有记录（监控、报纸、聊天记录）也显示10月28日从未存在。他感到深入骨髓的孤独与恐惧。
  - 3. 血字的证明：在第二次凌晨4:00到来前，林夜在自己的洗手间镜子上用血写下‘10月28日’。他在凌晨4:00前保持清醒，亲眼目睹世界在瞬间刷新——光线、温度、手机时间跳动。他冲进洗手间，镜子上的血字消失了，镜面洁净如新。所有物理证据再次被抹除，但这次，他确信了循环的存在。
emotional_beat: 从困惑与怀疑（‘我是不是疯了？’）→ 恐慌与抗拒（‘这不可能！’）→ 绝望的求证（‘你们难道都不记得了吗？’）→ 确认后的震惊与孤独（‘只有我一个人……’）→ 一种混杂着恐惧与兴奋的、想要抓住真相的冲动（‘我必须知道这是为什么。’）。
obstacle1: 主角林夜所经历的、连续的记忆（昨天被车撞的伤疤消失、日期回退）与整个世界（所有人、所有记录都显示昨天是普通的一天）之间的根本性矛盾。他尝试证明自己是对的，但每一次尝试都加深了他的孤独与世界的不可知。
ending: 林夜在确认重置的瞬间，手机屏幕亮起。没有信号，没有来电显示，却收到一条由本地系统应用‘效率助手’推送的空白消息。当他试图截屏时，消息消失得无影无踪，仿佛从未存在过。这暗示着‘系统’已经注意到了他这个‘异常体’。
