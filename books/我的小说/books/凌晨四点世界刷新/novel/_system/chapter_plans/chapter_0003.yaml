chapter: 3
goal: 让主角林夜经历第一次世界刷新，确认其真实性，并让他意识到自己成为了唯一保留记忆的‘清醒者’。同时，通过苏晚的POV，从外部视角展示林夜的变化，为后续的探索与反抗奠定基础。
conflict: 林夜所经历的、连续的记忆（昨天被车撞的伤疤消失、日期回退）与整个世界（所有人、所有记录都显示昨天是普通的一天）之间的根本性矛盾。他尝试证明自己是对的，但每一次尝试都加深了他的孤独与世界的不可知。同时，系统（通过‘效率助手’的空白消息）已开始注意到他这个‘异常体’，增加了外部威胁。
climax: 凌晨4:00，林夜在医院的病床上醒来，亲眼目睹世界从‘昨天’（他被撞的那天）瞬间‘更新’为‘今天’（他醒来发现日期倒退的这天）——天空、光线、手机日期、周围人的状态在一秒内完成切换。他通过预设的、不可能被复制的标记（在洗手间镜子上用血写的字）确认了重置的真实性，并确定只有自己记得。
cost: 林夜失去了对‘现实’的信任基础，被抛入一个只有自己知道真相的孤独战场。他前24小时积累的所有物理证据（录像、日记）随着刷新全部消失，一切只能依赖记忆，并且他意识到这种‘记忆’本身也成了系统的异常，可能带来危险。同时，苏晚因林夜的反常行为而对他产生怀疑，两人关系出现裂痕。
hook: 林夜在确认重置的瞬间，手机屏幕亮起。没有信号，没有来电显示，却收到一条由本地系统应用‘效率助手’推送的空白消息。当他试图截屏时，消息消失得无影无踪，仿佛从未存在过。这暗示着‘系统’已经注意到了他这个‘异常体’。紧接着，手机屏幕再次亮起，显示：『异常个体#0001，你的行为已触发‘效率校准协议’。请于下一次刷新前，前往最近的数据终端进行登记。』
scenes:
  - 场景1：苏晚的观察（白天）——苏晚是一名‘秩序维护局’初级调查员。在例行巡查中，她注意到林夜的反常行为：他在街头反复确认日期，对路人进行奇怪提问，甚至试图闯入医院档案室。苏晚跟踪林夜，记录下他的异常行为，并上报系统。她内心矛盾，既觉得林夜可疑，又隐约感到他眼中的恐惧是真实的。
  - 场景2：重置的见证（凌晨4:00）——林夜在医院的病床上醒来。他利用前几次循环积累的经验，预先在洗手间镜子上用血写下‘重置’二字。凌晨4:00整，世界瞬间切换。他看着镜中的字迹消失，手机日期跳回‘昨天’，窗外天空由黑夜变为黎明，一切都在一秒内完成。他确认重置真实存在。此时，手机收到‘效率助手’的空白消息，随后是‘效率校准协议’的警告。林夜意识到自己被系统标记，危险正在逼近。
emotional_beat: 从怀疑到确认，从恐惧到孤独，从无助到觉醒。林夜的情绪曲线：最初的困惑与否认（白天）→ 挣扎与尝试（反复验证）→ 确认重置时的震惊与崩溃（凌晨4:00）→ 收到系统消息时的恐惧与决绝（结尾）。苏晚的情绪曲线：从职业性的怀疑与警惕（跟踪林夜）→ 困惑与同情（观察到林夜的恐惧）→ 动摇与矛盾（上报后，内心开始质疑系统的绝对正确性）。
obstacle1: 林夜所经历的、连续的记忆（昨天被车撞的伤疤消失、日期回退）与整个世界（所有人、所有记录都显示昨天是普通的一天）之间的根本性矛盾。他尝试证明自己是对的，但每一次尝试都加深了他的孤独与世界的不可知。同时，系统（通过‘效率助手’的空白消息）已开始注意到他这个‘异常体’，增加了外部威胁。
ending: 林夜在确认重置的瞬间，手机屏幕亮起。没有信号，没有来电显示，却收到一条由本地系统应用‘效率助手’推送的空白消息。当他试图截屏时，消息消失得无影无踪，仿佛从未存在过。这暗示着‘系统’已经注意到了他这个‘异常体’。紧接着，手机屏幕再次亮起，显示：『异常个体#0001，你的行为已触发‘效率校准协议’。请于下一次刷新前，前往最近的数据终端进行登记。』
