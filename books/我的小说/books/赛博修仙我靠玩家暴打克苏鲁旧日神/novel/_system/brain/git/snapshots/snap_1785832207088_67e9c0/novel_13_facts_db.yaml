  - id: F013
    fact: 林砚左臂自第3章起焦毁且知觉丧失（定稿确立）。表现：左臂只能作为无知觉残肢垂着，撞到硬物感觉不到疼；需要用力的动作（按闸门、推炉沿、撑地、撬门）一律由右臂/肩膀/躯体完成。禁止左臂「发力」「撑地」「按紧」「用上力」；左臂可被描写为「发麻」「空荡荡」「不属于自己」「像烧断的木头」。
