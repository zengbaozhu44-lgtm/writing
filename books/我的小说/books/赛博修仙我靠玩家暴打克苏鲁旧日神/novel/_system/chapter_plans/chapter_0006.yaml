chapter: 6
goal: 展现青穹重工‘净化计划’的凌厉反击——顶级机械修士‘蚀骨’对林砚发动定点清除，通过玩家军团的预警、牺牲与反制，凸显玩家体系核心价值；林砚在反杀后获取关键情报，将主线引向旧日支配者‘混沌之核’的封印之地。
conflict: 青穹重工对林砚的定点清除与林砚及玩家军团的生存反击。‘蚀骨’不仅战力碾压普通玩家，其邪神污染能力更试图直接锁定林砚进行精神斩杀，形成技术与精神层面的双重绞杀。同时，玩家‘雷达’功能被邪神污染干扰的弱点暴露，防线出现致命漏洞。
climax: ‘蚀骨’突破玩家层层防线，在林砚面前施展邪神禁术，精神攻击直刺其神魂。林砚借助玩家‘雷达’预警争取的宝贵时间，利用刚刚爆出的神级义体‘数据眼’逆天改命，看穿‘蚀骨’招式中的因果破绽，以数据流飞剑一击反杀，完成从猎物到猎人的瞬间逆转。
cost: 林砚为强行驱动‘数据眼’并解析邪神代码，神魂遭受严重反噬，左臂义体彻底烧毁，短时间内战力大幅下滑，不得不依赖玩家军团保护。同时，此战暴露了玩家‘雷达’功能可被邪神污染干扰的弱点，玩家军团面临新的威胁。
hook: 林砚通过‘数据眼’的最后一瞥，看到了‘蚀骨’记忆深处的一个坐标——旧日支配者‘混沌之核’的封印之地，赫然就在浮空城地底深处。同时，他的系统界面跳出一条红色警告：【检测到高维污染源正在尝试改写玩家世界规则……】
scenes:
  - 场景一（预警与陷阱）：一刀岁暮的直播间画面突然出现雪花噪点，雷达系统在邪神污染干扰下发出矛盾警报。青穹重工顶级机械修士‘蚀骨’以扭曲灵能场屏蔽玩家感知，在玩家军团集结的空档期，悄然渗透至林砚所在的塔顶指挥室。观众弹幕疯狂刷屏预警，一刀岁暮不顾系统‘数据异常’警告，强行开启直播画面为林砚示警，被蚀骨的灵能反噬震伤。
  - 场景二（牺牲与反杀）：蚀骨现身，邪神禁术直刺林砚神魂。林砚以玩家预警争取的时间为代价，强行驱动刚爆出的神级义体‘数据眼’，在蚀骨的精神攻击中找到因果破绽，以数据流飞剑一击反杀。战斗结束后，林砚左臂义体烧毁，神魂反噬。他通过‘数据眼’最后一瞥，看到蚀骨记忆深处——旧日支配者‘混沌之核’的封印坐标，赫然就在浮空城地底。系统界面同时跳出红色警告：【检测到高维污染源正在尝试改写玩家世界规则……】
emotional_beat: 紧张压迫（雷达失灵、暗杀逼近）→ 悲壮牺牲（玩家预警、一刀岁暮负伤）→ 绝境逆转（数据眼反杀）→ 战栗惊惧（发现地底封印坐标与高维污染警告）
