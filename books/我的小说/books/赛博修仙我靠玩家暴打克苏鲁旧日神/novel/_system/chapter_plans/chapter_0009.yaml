chapter: 9
goal: 第9章是「裂隙」卷的第一个里程碑——林砚第一次主动使用【数据祛妄】核心能力对抗触手渗透，并付出明确可见的代价。触手线从第8章的「被动目睹」推进到「主动介入」：触手确实跟着玩家信号爬进了玩家世界，且源头直指林薇的直播信号。本章让读者感到「爽点落地，同时埋下更大的恐惧」，而不是又一个悬置钩子。
conflict: 触手是跨服务器边界的侵蚀，不是可被玩家刷掉的怪物——常规玩家手段对它无效。林砚的【数据祛妄】能净化它，但作用半径、消耗与反噬未知。与此同时，玩家世界政府察觉异变，以「监管」之名要求林砚交出玩家频道的数据接口：拒绝则失去政府信任与资源，交出则把触手渗透通道也暴露给政府。
climax: 林砚主动释放【数据祛妄】，循着触手留下的数据痕迹反向追踪到它爬过来的源头——定位到林薇的直播信号所在的服务器节点。净化展开的瞬间，触手被逼退，但代价立现：林砚的神魂被反噬撕开一道裂口，焦毁的左臂上旧疤重新渗血。他第一次「看见」触手源头那头的景象——林薇坐在一间亮着屏幕的房间里，一根从天花板垂下的触手正对着她的后颈。她没回头，但声音穿过信号传来：「哥，别开那扇门。门后面……有人。」
cost: 三重重代价——(1) 神魂反噬，数据流修为倒退一小截，后续章必须「养伤」；(2) 玩家世界政府发现他能直接触碰高维信号，从「监管」升级为「监控」，林砚自由行动空间被压缩；(3) 触手被逼退后没有消失，只是换了一条更隐蔽的路径，而且林砚暴露了【数据祛妄】的存在，更高维的诡秘开始「点名」他。
hook: 林砚收起【数据祛妄】，看着左臂重新渗血的旧疤。他知道下一波触手不会再从直播间来——它已经记住他了。他给沈寒舟发了一条消息：「从今天起，我的每次数据流输出，你盯着。」——不是因为他会失控，而是他决定：门，他要自己打开，但要有人在门外等他。
scenes:
  - 场景1：浮空城指挥室——林砚复盘政府警告与触手渗入的路径，决定不再被动等待。他准备第一次主动释放【数据祛妄】，先做一次对自己神魂的「自我检查」，确认能力边界与消耗。
  - 场景2：反向追踪——林砚以【数据祛妄】循着触手留下的数据痕迹深入服务器底层，与玩家世界政府派来的「监管员」对峙周旋；净化触及触手本体时，神魂反噬爆发。
  - 场景3：门后景象——林砚被迫「看见」触手源头：林薇被一根触手对着后颈，她出声警告「别开那扇门」。净化撤回，触手换路，林砚立誓自己开门但要有人接应。
emotional_beat: 从复盘时的冷静压抑，到主动释放能力时的紧张决绝，再到反向追踪成功时的一瞬希望，随后被神魂反噬与「门后有人」的惊悚打断，最后在「我要自己开门」的决意中收尾。情绪曲线：冷静 → 决绝 → 希望 → 惊惧 → 沉重决意。
