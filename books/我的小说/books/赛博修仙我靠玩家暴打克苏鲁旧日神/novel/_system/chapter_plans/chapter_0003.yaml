chapter: 3
goal: 完成玩家首战，展示玩家军团对机械执法者的碾压性优势，林砚获取战斗数据并解锁【召唤阵强化】技能，同时埋下财团背后克苏鲁祭司的悬念。
conflict: 青穹重工派遣的机械执法者小队突袭林砚藏身点，企图抹杀异类；玩家军团以不死之身应战，但机械执法者的灵能护盾与协同火力对低等级玩家造成大规模伤亡，战局一度胶着。
climax: 林砚利用管理员权限实时提取玩家死亡数据，解析出执法者护盾的频率漏洞，将数据流注入战场，解锁【召唤阵强化】技能，全体玩家获得临时属性加成，以花式战术彻底击溃机械执法者。
cost: 林砚因强行调用管理员权限解析数据，导致神魂超载，右臂义体再次崩裂，短暂丧失战斗力；同时，战斗动静暴露了玩家降临的坐标，引来更高级别势力的注意。
hook: 战斗结束后，林砚通过一名玩家的共享视野，瞥见财团基地深处，一只克苏鲁祭司的虚影正在低语，其目光似乎穿透了虚空，直接锁定了玩家通道的入口。
scenes:
  - 场景1：机械执法者突袭——林砚藏身点被锁定，八台机械执法者从天而降，灵能护盾展开，火力网封锁所有退路。玩家军团仓促应战，前几波冲锋被碾压，死亡数十次，但玩家非但不惧反而兴奋刷屏，林砚冷静观察执法者战斗数据。
  - 场景2：数据解析与反击高潮——林砚借助玩家反复死亡产生的战斗数据流，破译执法者护盾频率，启动【召唤阵强化】，玩家获得临时强化，以‘肉身炸弹’、‘电锯冲锋’等花式战术反杀执法者，全歼敌人。
emotional_beat: 从紧张压抑（被围剿的绝望）→ 混乱狂热（玩家不怕死的荒诞感）→ 冷静破局（数据流解析的智斗爽感）→ 胜利后的短暂松懈 → 结尾骤然跌入更深层的诡秘悬念（克苏鲁祭司注视的寒意）。
obstacle1: 青穹重工派遣的机械执法者小队突袭林砚藏身点，企图抹杀异类；玩家军团以不死之身应战，但机械执法者的灵能护盾与协同火力对低等级玩家造成大规模伤亡，战局一度胶着。
ending: 战斗结束后，林砚通过一名玩家的共享视野，瞥见财团基地深处，一只克苏鲁祭司的虚影正在低语，其目光似乎穿透了虚空，直接锁定了玩家通道的入口。
