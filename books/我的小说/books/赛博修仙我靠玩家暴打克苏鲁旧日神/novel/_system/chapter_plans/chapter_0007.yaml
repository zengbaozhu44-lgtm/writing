chapter: 7
goal: 在蚀骨渗透的紧迫威胁下，完成对铁颅军团先锋部队的首次战术反制，展示玩家体系的进化与管理员权限的初步运用，同时为更深的阴谋埋下伏笔。
conflict: 机械军阀「铁颅军团」的巨型战争机器「颅骨碾压者」逼近浮空城，其内部核心被混沌之核的次级污染驱动，常规攻击无效。林砚必须在不暴露全部底牌的情况下，指挥玩家军团找到破解之法。
climax: 林砚放弃正面硬抗，利用玩家无限复活的特性，设计「尸潮战术」：数千名玩家以自杀式冲锋缠住「颅骨碾压者」，掩护精英小队深入其内部，植入林砚以管理员权限编写的「数据祛妄」病毒，从内部瓦解污染核心。
cost: 玩家军团阵亡超过两万人次，大量低级装备报废；林砚强行以数据流连接战场，神魂再次受到轻微污染，为后续埋下隐患；浮空城外围防御工事被摧毁三分之一。
hook: 「颅骨碾压者」被摧毁的瞬间，林砚的数据眼捕捉到核心深处一串不属于任何已知代码的坐标——直指混沌之核的沉睡之地。同时，现实世界直播平台上一个神秘ID发出一条弹幕，用只有林砚能看懂的语言警告：「你正在打开不该打开的门。」
scenes:
  - 场景一：战争前夜——林砚召开战术会议，玩家主播「一刀岁暮」直播间出现异常信号，提前预警铁颅军团进攻。林砚利用权限快速部署，玩家军团完成动员，展现高度组织性。
  - 场景二：尸潮战术——铁颅军团先锋「颅骨碾压者」登场，正面碾压玩家防线。林砚临场指挥，玩家以自杀式攻击消耗敌方，精英小队突入内部，植入病毒，完成反杀。
emotional_beat: 从紧张压抑的战争阴云，到玩家军团悍不畏死的热血狂欢，再到战术成功的短暂喜悦，最后急转直下落入对未知阴谋的冰冷恐惧。
