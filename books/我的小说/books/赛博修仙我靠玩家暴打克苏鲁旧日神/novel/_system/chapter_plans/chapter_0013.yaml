chapter: 13
goal: 林砚在青穹重工机械执法者的追杀中完成第一批玩家招募，验证玩家体系的核心优势，并初步建立玩家信任，为后续对抗财团铺垫基础。
conflict: 林砚必须在青穹重工追兵逼近的极短时间内，将一群以游戏心态介入的菜鸟玩家拧成一股有效的战斗力量。玩家们的不信任、混乱与对死亡的轻慢，与末世残酷现实形成尖锐碰撞，同时林砚还需应对机械执法者压倒性的火力压制。
climax: 青穹重工机械执法者突袭藏身点，玩家们以‘游戏开荒’心态疯狂反击，用一次次死亡试探出机械执法者的攻击模式与数据破绽。林砚抓住转瞬即逝的机会，以数据流功法夺取其核心战斗数据，解锁【召唤阵强化】技能雏形，并指挥玩家完成第一次反杀。
cost: 林砚为掩护玩家撤退和夺取数据，被迫全力运转数据流权限，强烈的能量波动被青穹重工总部精确定位，他被标记为‘高价值异常目标’，引来了更强大、无情的后续追杀者。
hook: 林砚的脑海中响起系统提示：‘玩家招募通道已激活，第一位玩家已确认身份——昵称：爷傲奈我何。是否接入？’与此同时，远处青穹重工的机械猎犬发出刺耳鸣叫，锁定了他所在的坐标。
scenes:
  - 场景一：废墟藏身点内，林砚向首批玩家解释世界规则并布置防守，玩家们将信将疑，态度散漫，林砚内心焦灼。
  - 场景二：青穹重工机械执法者破墙而入，在绝对火力压制下，玩家们以游戏心态疯狂反击，用死亡试探出敌人数据破绽，林砚趁机夺取核心数据，指挥反杀，成功击退敌人。
emotional_beat: 从重生后的冰冷决绝，到面对玩家散漫时的焦灼与隐忍；再到战斗爆发时的紧张刺激，以玩家花式送死为转折的荒诞与热血；最终在击退强敌、确认玩家价值后，升华为一种孤独中握住一丝希望的复杂笃定，结尾又被新的危机拉回紧绷。
