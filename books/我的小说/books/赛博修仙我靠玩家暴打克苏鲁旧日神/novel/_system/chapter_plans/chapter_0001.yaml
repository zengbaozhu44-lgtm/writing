chapter: 1
goal: 林砚在浮空城陷落、神魂破碎的濒死绝境中，觉醒【世界管理员GM权限】，窥见世界为高维测试服务器的真相，并回溯时间重生至三年前邪神入侵与财团叛变的关键节点，为逆转末世奠定基础。
conflict: 林砚肉身与神魂双重崩毁，濒死弥留之际意识被邪神低语侵蚀，同时青穹重工叛军围攻，生存与认知的双重绝境迫使他必须在崩溃中抓住唯一的觉醒契机。
climax: 林砚在意识即将被低语彻底吞噬的瞬间，触碰到世界底层数据流，系统提示【世界管理员GM权限】激活，世界真相与重生倒计时同时涌入脑海，他于弥留之际睁眼，回到三年前财团叛徒笑脸相对的关键节点。
cost: 林砚为激活管理员权限，被迫燃烧残存神魂核心，重生后仅剩24小时缓冲期，且神魂严重受损，义体算力下降，需在极短时间内逆转既定毁灭结局。
hook: 看着掌心跳动的数据流权限，林砚眸光冰冷。前世他倾尽所有守护人族，换来背叛惨死。这一世，手握管理员权柄，他只剩24小时——要以玩家为刃，屠尽叛贼邪神！
scenes:
  - 场景1：浮空城‘新希望’陷落之夜——林砚半机械仙体崩碎、神魂遭低语侵蚀，昔日庇护的青穹重工倒戈围攻，战友全员战死，他在废墟中濒死挣扎，直面信念崩塌与邪神污染的双重绝境。
  - 场景2：管理员权限觉醒与时间回溯——林砚在意识弥留之际窥见世界为高维测试服务器的真相，系统提示激活【世界管理员GM权限】，时间倒转至三年前邪神入侵、财团叛变的关键节点，他于祭坛废墟中睁眼，面对叛徒笑脸，启动玩家招募令。
emotional_beat: 从绝望悲壮（血战三年、战友尽灭、遭背叛的愤恨）→ 濒死挣扎（低语侵蚀、意识模糊的痛苦）→ 真相冲击（世界为服务器的认知颠覆）→ 冰冷杀意（重获新生、手握权柄、誓要复仇逆转的决绝）
obstacle1: 林砚肉身与神魂双重崩毁，濒死弥留之际意识被邪神低语侵蚀，同时青穹重工叛军围攻，生存与认知的双重绝境迫使他必须在崩溃中抓住唯一的觉醒契机。
ending: 看着掌心跳动的数据流权限，林砚眸光冰冷。前世他倾尽所有守护人族，换来背叛惨死。这一世，手握管理员权柄，他只剩24小时——要以玩家为刃，屠尽叛贼邪神！
