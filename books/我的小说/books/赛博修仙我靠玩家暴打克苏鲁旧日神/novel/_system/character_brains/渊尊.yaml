character: 渊尊
goals:
  surface: 维持青穹重工掌权者的伪善面具，以'人类存续'为名整合浮空城势力，明面上对抗邪神入侵，实则清除所有可能威胁计划的变量（尤其是林砚）。
  hidden: 彻底放开深空裂隙，让旧日支配者完全降临现世。通过《诡械吞神典》吞噬整个世界服务器（人类、修士、玩家、数据流、灵气）的能量，取代世界规则，晋升为新的旧日之神。他早已洞悉林砚是GM漏洞，前世背叛抹杀并非临时起意，而是刻意为之——他要将林砚这个'世界唯一漏洞'作为最终献祭的钥匙，开启完全降临的仪式。
fears:
  - 旧日支配者完全降临后，自己作为'容器'会被彻底吞噬，失去自我意识，沦为纯粹的傀儡（他虽已死，但残存的本能仍在抗拒彻底消亡）。
  - 林砚作为世界服务器漏洞，其管理员权限可能绕过他的布局，将世界格式化或重启，使他数百年的谋划化为泡影。
  - 玩家文明的自组织性——第四天灾的不可控性，他们不遵循这个世界的逻辑，可能以荒诞的方式破坏他精心计算的献祭仪式。
bottom_line: 无底线。为成神可以牺牲一切，包括屠戮众生、背叛同族、献祭世界。他的底线是'自身存在的延续'——即使成为容器，也要以'渊尊'的意志完成降临，而非被完全抹除。
current_state:
  trust_protagonist: 0
  fear: 15
  betrayal_probability: 100
  suspicion: 100
  loyalty: 0
growth_arc: 从'心怀救世的理想主义者'，到'被邪神诱惑而堕落'，再到'主动配合邪神的傀儡'，最后在30章正式登场时，已彻底转化为'伪神境机械邪神'。他的成长弧线是一条加速沉沦的曲线——不是变强，而是在'非人化'的道路上越走越远。他越接近旧日邪神，就越失去残存的人性，最终在后期可能沦为纯粹的机械邪神容器，成为主角必须跨越的终极障碍。
