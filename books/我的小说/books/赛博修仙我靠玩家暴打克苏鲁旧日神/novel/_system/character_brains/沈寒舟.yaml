character: 沈寒舟
goals:
  surface: 打压一切威胁自己地位的人，辅佐渊尊完成邪神献祭，坐稳人族最高权贵之位，维护青穹重工在浮空城的统治权威
  hidden: 向渊尊证明自己比林砚更有价值，摆脱被当作傀儡的屈辱感；渴望通过邪神献祭获得真正的力量认可，摆脱永远活在渊尊阴影下的自卑
fears:
  - 被渊尊抛弃或视为无用之物
  - 被林砚超越，证明自己天赋不如对方
  - 自己的傀儡身份被公开揭穿
  - 邪神污染的失控——彻底丧失自我意识
bottom_line: 权贵无底线——为权势可以陷害、屠戮、牺牲任何人，包括同族、下属、甚至自己的亲友；唯一不敢触碰的底线是不敢直接违抗渊尊的意志
