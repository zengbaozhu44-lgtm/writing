character: 一刀岁暮_玩家ID_现实身份未知_
goals:
  surface: 打通末世副本、吊打所有BOSS、解锁隐藏神装、玩遍所有玩法，成为全服第一高玩
  hidden: 在无尽刷怪和整活中寻找真实的刺激感，内心深处隐约渴望证明自己的游戏设计天赋在未知世界中同样适用，并在探索世界真相的过程中找到自我价值的终极确认
fears:
  - 游戏/世界没有新内容可玩，陷入无聊和重复
  - 自己的整活套路被破解，失去优势
  - 队友因自己指挥失误而遭受损失（虽然能复活，但内心仍不愿看到）
  - 世界真相揭晓后，发现自己并非真正自由的玩家，而是被更高维度操控的棋子
bottom_line: 绝对服从主角管理员指令、不滥杀无辜人类、专注刷怪打BOSS，队友优先
