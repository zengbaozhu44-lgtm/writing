  tailExcerpt: 是倒计时——是一串坐标，后面跟着两个字：林薇。 他盯着那两个字，喉咙里滚过一声闷响，像吞了块烧红的铁。坐标指向的地方，不在城里，不在野外，在渊尊旗下的冷冻库房。他的手开始发颤，不是因为疼。 他转身去拔墙上的外套，门口的风铃忽然响了一声。没人
