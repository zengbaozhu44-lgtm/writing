  tailExcerpt: 锁孔里。他攥着剩下的半截，金属边缘陷进虎口，血渗进指缝。门缝里挤出沈寒舟的声音，断续，像信号被搅碎：“……蚀骨，三点。” 他手腕抖得厉害，钥匙尖对不准孔位。第二次戳偏，铁屑簌簌落进锁芯。远处传来第一声警笛，越来越近，像倒计时的指针开始走动。
