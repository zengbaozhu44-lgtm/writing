# Authored Ch1 plan — seeds trackable facts F1–F5 for rebaseline.
# Does NOT prescribe Chapter 2 handling (no Ch2 authored plan).
pov: 苏晚
goal: 苏晚因天花板漏水找老何对质，最终交出配电间备用钥匙，并得知周四下午三点的约定
conflict: 邻里责任推诿与钥匙归属
obstacle1: 老何指责苏晚私藏钥匙导致无法及时关阀
obstacle2: 苏晚不愿交出最后一点控制权
climax: 苏晚把钥匙交到老何手里；老何告知周四下午三点再来取工具并检查
hook: 苏晚独自回三楼，天花板又滴下一滴水
ending: 约定悬而未决；钥匙已不在苏晚手里
cost: 苏晚失去独自掌控配电间钥匙
scenes:
  - 场景1：苏晚发现天花板漏水加重，下楼找老何。两人在一楼门厅争执责任。苏晚承认抽屉里有配电间备用钥匙，但未交出。
  - 场景2：老何逼问钥匙来历。苏晚得知周四下午三点物业要查楼、老何会再来取工具。关系从冷淡转为当面撕破脸后的勉强合作。苏晚把钥匙交给老何。
  - 场景3：老何离开。苏晚独自上楼，确认钥匙已不在自己手里。天花板再滴一滴水。周四三点的约定悬着，无人解决漏水本身。
