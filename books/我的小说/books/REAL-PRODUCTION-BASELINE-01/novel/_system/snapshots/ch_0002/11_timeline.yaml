      - 她：她转身上楼
      - 苏晚：事往下推。你先把钥匙还我，我顺手把工具拿走。别让他们来了挑你茬。” 苏晚站在走廊里，手里的空钥匙包软掉了一点。楼梯间传来远处的门铃声，她没去看。抬头看天花板，水
      - 苏晚：吱了一声。她听见脚板贴在水渍上的声音，慢，没急。 她回过头看天花板。水泡又鼓起来了，边沿裂了一道细缝。她闭了闭眼，睫毛蹭在湿热的空气上。楼梯口的门铃又响了，没人
      - 场面：什么也没剩。 食指关节蹭着粗糙的拉链齿，发白。 她深吸了一口。 沉下去。 她把钥匙包的口袋翻了个底朝上。 塑料在手里啪嗒折了一下。 什么也没剩。 食指关节蹭着粗
