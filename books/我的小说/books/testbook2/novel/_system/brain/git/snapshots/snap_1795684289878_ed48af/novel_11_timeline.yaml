      - 场面：雨一时半会儿停不了。” 沈迟站在原地。磁带在掌心里硌着。他数到七——数到七才动。 抬脚的时候，他注意到门槛上有一道浅浅的凹槽，磨得发亮，像被无数双脚进进出出踩出
