story_arc:
  title: 雾桥谜案
  total_chapters: 10
  volumes:
    - name: 觉醒
      chapters:
        - 1
        - 2
      arc_phase: setup
      emotional_curve: 压抑→疑惑→恐惧
      must_establish:
        - 世界异常规则
        - 主角身份与日常压力
        - 核心悬念第一次露面
    - name: 裂隙
      chapters:
        - 3
        - 4
      arc_phase: confrontation
      emotional_curve: 试探→信任→背叛→绝望
      must_payoff:
        - 同盟或信息差建立
        - 第一次反击或失败
    - name: 重构
      chapters:
        - 5
        - 6
      arc_phase: climax_build
      emotional_curve: 愤怒→决绝→牺牲
      must_establish:
        - 多方势力决战准备
    - name: 归零
      chapters:
        - 7
        - 10
      arc_phase: resolution
      emotional_curve: 毁灭→新生→留白
      must_payoff:
        - 最终真相
        - 世界代价与余韵
