milestones:
  - id: m1
    chapter: 5
    event: 第一次不可逆代价（死亡/暴露/失去）
    setup_chapters:
      - 1
      - 2
      - 3
      - 4
    must_have:
      - 主角确认异常可改写现实或等价规则
      - 外部压力开始追捕/封锁
    emotional_requirement: 读者感到「爽但不安」
    failure_if_missing:
      - 若该章仍未付出代价，主线动力不足
  - id: m2
    chapter: 3
    event: 第一次主动使用核心能力并付出明确代价
    setup_chapters: []
    must_have:
      - 能力边界清晰
      - 代价可见
    emotional_requirement: 爽点落地同时埋下更大恐惧
