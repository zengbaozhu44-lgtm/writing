chapter: 2
goal: 让主角林夜经历第一次世界刷新，确认其真实性，并让他意识到自己成为了唯一保留记忆的‘清醒者’，为后续的探索与反抗奠定基础。
conflict: 林夜所经历的连续记忆（昨天被车撞的伤疤消失、日期回退）与整个世界（所有人、所有记录都显示昨天是普通的一天）之间的根本性矛盾。他尝试证明自己是对的，但每一次尝试都加深了他的孤独与世界的不可知。
climax: 凌晨4:00，林夜在医院的病床上醒来，亲眼目睹世界从‘昨天’（他被撞的那天）瞬间‘更新’为‘今天’（他醒来发现日期倒退的这天）——天空、光线、手机日期、周围人的状态在一秒内完成切换。他通过预设的、不可能被复制的标记（在洗手间镜子上用血写的字）确认了重置的真实性，并确定只有自己记得。
cost: 林夜失去了对‘现实’的信任基础，被抛入一个只有自己知道真相的孤独战场。他前24小时积累的所有物理证据（录像、日记）随着刷新全部消失，一切只能依赖记忆，并且他意识到这种‘记忆’本身也成了系统的异常，可能带来危险。
hook: 林夜在确认重置的瞬间，手机屏幕亮起。没有信号，没有来电显示，却收到一条由本地系统应用‘效率助手’推送的空白消息。当他试图截屏时，消息消失得无影无踪，仿佛从未存在过。这暗示着‘系统’已经注意到了他这个‘异常体’。
scenes:
  - 场景1：孤独的证明。林夜从医院醒来，试图向同事苏晚和好友陈默证明昨天的异常，但所有人都认为他车祸后产生了幻觉。他检查手机、日记、监控录像——一切证据都指向‘昨天是普通的一天’。他发现昨晚在镜子上用血写的字消失了，浴室镜面洁净如新。
  - 场景2：重置的见证。凌晨3:55，林夜在病房洗手间内，用指甲在镜面划下‘04:00’的标记。他紧盯着手机屏幕，看着时间从03:59:59跳至04:00:00。世界在瞬间切换——窗外的光线、走廊的脚步声、手机显示的日期，一切都在一秒内变成了‘今天’的状态。镜子上的划痕消失得无影无踪。他确认了重置的真实性。手机屏幕亮起，弹出‘效率助手’的空白消息。
emotional_beat: 从困惑与否认，到焦虑与孤独，最终在确认重置的瞬间被恐惧与警觉取代，结尾留下一丝被注视的不安与悬念。
obstacle1: 林夜所经历的连续记忆（昨天被车撞的伤疤消失、日期回退）与整个世界（所有人、所有记录都显示昨天是普通的一天）之间的根本性矛盾。他尝试证明自己是对的，但每一次尝试都加深了他的孤独与世界的不可知。
ending: 林夜在确认重置的瞬间，手机屏幕亮起。没有信号，没有来电显示，却收到一条由本地系统应用‘效率助手’推送的空白消息。当他试图截屏时，消息消失得无影无踪，仿佛从未存在过。这暗示着‘系统’已经注意到了他这个‘异常体’。
