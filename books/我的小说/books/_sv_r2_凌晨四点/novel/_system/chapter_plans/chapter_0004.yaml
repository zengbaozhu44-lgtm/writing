chapter: 4
goal: 通过苏晚的POV，展现林夜在第一次世界刷新后的异常行为，以及她如何从怀疑到确认林夜知晓某种真相，并最终与林夜建立初步联盟。同时，揭示系统对林夜这个‘异常体’的首次监控信号。
conflict: 苏晚作为秩序维护局的初级分析师，其职责是报告异常个体，但她对林夜的信任与好奇让她选择暂时隐瞒；林夜则试图说服苏晚相信循环存在，但缺乏证据，两人在信任与怀疑之间博弈。
climax: 凌晨4:00，林夜在医院病床上醒来，亲眼目睹世界刷新。他利用预设的血字标记确认重置真实性，并向赶来的苏晚展示这一无法被系统抹除的证据。苏晚的手机同时收到‘效率助手’推送的空白消息，证实系统已注意到林夜。
cost: 苏晚因隐瞒林夜的情况被秩序维护局内部系统标记为‘关联异常个体’，她的权限被降级，行动受到更严格监控。林夜则失去了对现实的信任基础，并意识到自己已成为系统的靶子。
hook: 林夜的手机屏幕再次亮起，显示一条来自‘效率助手’的私人消息：『异常个体#0001，你的行为已触发‘效率校准协议’。请于下一次刷新前，前往最近的数据终端进行登记。』消息下方，是一个不断闪烁的倒计时：23:59:58。
scenes:
  - 场景1：苏晚的监视。苏晚在秩序维护局的监控中心，调取林夜在‘昨天’（被车撞前）的公共记录，发现他的行为模式与效率优化基线存在微小但持续的偏差。她决定亲自前往医院，以‘心理评估’为借口接近林夜。
  - 场景2：病房对峙。苏晚与林夜在病房交谈。林夜试图解释循环，但苏晚用逻辑和数据反驳。林夜提出一个测试：凌晨4:00，他会证明一切。苏晚同意留下观察，但内心充满怀疑。
  - 场景3：重置的见证。凌晨4:00，世界刷新。林夜从病床上醒来，确认伤疤消失、日期回退。他带苏晚去洗手间，展示他用血写的字——‘4:00 REAL’。字迹在刷新后依然存在，因为血是林夜身体的一部分，随刷新重置。苏晚震惊，她的手机收到空白消息，系统开始反应。
  - 场景4：系统的低语。林夜和苏晚回到病房，林夜的手机收到‘效率校准协议’的警告。苏晚意识到事情的严重性，她决定暂时不报告林夜，而是帮助他调查。两人达成初步联盟，但苏晚内心对秩序维护局的忠诚开始动摇。
emotional_beat: 从苏晚的理性怀疑，到震惊与困惑，再到面对系统威胁时的恐惧与决断，最终在信任与背叛的边缘选择了临时联盟，情绪曲线呈现‘怀疑→震惊→恐惧→坚定’的上升与转折。
