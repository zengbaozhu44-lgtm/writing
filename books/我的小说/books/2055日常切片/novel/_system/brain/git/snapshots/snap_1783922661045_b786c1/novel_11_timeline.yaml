  current_day: 3
days:
  - day: 1
    time: 00:00
    events:
      - 建立 POV（张北）当下目标：通过外卖员张北在2055年夏季清晨的日常，呈现一个AI全面渗透、系统精密优化个体生活的未来世界，并埋下个体自主性与系统性控制之间张力的种子。
      - 克服阻碍：张北在系统预设的‘最优’生活轨迹（智能唤醒、AI规划路线、健康评分）中，感受到的便利与隐约的窒息感之间的内在冲突；以及他作为个体，面对系统规则（碳中和积分、健康评分）时的无力与微小反抗。
      - 张北在老旧小区与‘数字隔离户’老人的短暂交谈——老人因儿子‘生物芯片过敏’失业，靠社区低保度日。这次对话像一面镜子，让张北第一次清晰看到‘系统之外’的代价，也让他对自己被量化的生活产生明确的疑虑。
      - 张北在晨光中骑上平衡车，系统推送的第一单地址，正是那位‘数字隔离户’老人所在的社区。他看了一眼健康评分面板上跳动的数字，突然感到，这个清晨的唤醒，或许不只是生物节律的循环。
    characters_present:
      - 张北
    chapter: 1
  - day: 2
    time: 00:00
    events:
      - 建立 POV（林晓）当下目标：展现维修工林晓在系统规则与人性需求之间的日常博弈；通过一次紧急维修和取药任务，揭示AI系统高效背后的僵化与漏洞，以及底层居民如何利用非正式关系（人情、互助积分）在缝隙中生存。
      - 克服阻碍：林晓必须在完成系统派发的六台机器人维修任务（维持生计）与为女儿取得急需的哮喘药（维持生命健康）之间分配有限的时间和信用资源；系统（AI巡检、药房AI、处方验证）不断制造障碍，而人情网络（独居老人、老医生）则提供非正规的解决方案，两者形成对抗。
      - 傍晚药房，林晓手持非正式渠道获得的电子凭据，却被药房AI以“跨区处方无效”拒绝出药。他必须在15分钟内找到参加线上听证会的社区管理员获得手动授权，否则凭据失效，女儿今晚将无药可用。最终他被迫上传女儿的隐私监控视频作为“紧急凭证”，换取授权，但个人信用档案被永久标记。
      - 深夜，林晓在维修最后一台机器人时，发现其内存芯片中残留了一段未加密的对话日志，内容显示有市民计划在“全民气候共识日”期间，利用配送网络传播反对碳配额上调的手写传单。他望向窗外社区集会的灯光，陷入了沉默与抉择。
    characters_present:
      - 林晓
    chapter: 2
