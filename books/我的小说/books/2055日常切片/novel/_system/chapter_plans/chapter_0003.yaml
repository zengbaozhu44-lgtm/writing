chapter: 3
goal: 展现维修工林晓在系统规则与人性需求之间的日常博弈；通过一次紧急维修和取药任务，揭示AI系统高效背后的僵化与漏洞，以及底层居民如何利用非正式关系在缝隙中生存。
conflict: 林晓必须在完成系统派发的六台机器人维修任务（维持生计）与为女儿取得急需的哮喘药（维持生命健康）之间分配有限的时间和信用资源；系统不断制造障碍（AI巡检、药房AI、处方验证），而人情网络（独居老人、老医生）则提供非正规的解决方案，两者形成对抗。
climax: 傍晚药房，林晓手持非正式渠道获得的电子凭据，却被药房AI以“跨区处方无效”拒绝出药。他必须在15分钟内找到参加线上听证会的社区管理员获得手动授权，否则凭据失效，女儿今晚将无药可用。最终他被迫上传女儿的隐私监控视频作为“紧急凭证”，换取授权，但个人信用档案被永久标记。
cost: 林晓的个人信用档案被添加“非常规数据使用”备注，未来可能影响他申请更高级别的工作或贷款；他上传了女儿哮喘发作的隐私监控视频，该数据被AI系统永久记录，家庭隐私进一步被系统侵蚀。
hook: 深夜，林晓在维修最后一台机器人时，发现其内存芯片中残留了一段未加密的对话日志，内容显示有市民计划在“全民气候共识日”期间，利用配送网络传播反对碳配额上调的手写传单。他望向窗外社区集会的灯光，陷入了沉默与抉择。
scenes:
  - 清晨6:30，林晓被智能床垫的生物数据监测系统唤醒，系统推送今日维修任务列表（六台机器人），并提示女儿小鹿的哮喘药库存仅剩两天的剂量。他必须在完成维修任务和取药之间做出取舍。
  - 上午9:00，林晓前往第一台故障机器人处——社区广场的清洁机器人。维修过程中，遇到独居老人赵大爷，赵大爷抱怨最近社区AI系统减少了‘互助积分’的兑换额度，导致他无法用积分换取降压药。林晓用自己多余的积分帮赵大爷换了一瓶药，赵大爷感激之余，告诉他老城区有位老医生可以‘绕开系统’开处方。
  - 中午12:30，林晓利用午休时间赶往老城区，找到老医生。老医生在查看了小鹿的病历后，愿意开具纸质处方，但要求林晓用一次‘非正式维修’作为交换——修理他诊所里一台被系统标记为‘待报废’的旧呼吸机。林晓答应，但维修时间被压缩。
  - 下午3:00，林晓在修理第二台机器人时，接到系统派发的紧急任务：一台位于‘数字隔离户’区域的配送机器人故障，需立即处理。他赶到后发现，该区域信号屏蔽，机器人内存中存储了大量未上线的‘离线互助’数据——居民们用纸条和口头约定构建的本地互助网络。林晓意识到，系统之外的生活正在生长。
  - 下午5:30，林晓终于完成五台机器人维修，但最后一台位于城市边缘的物流仓库。他权衡后决定先去药房取药，再赶回仓库。药房AI以‘跨区处方无效’拒绝出药，他必须在15分钟内找到社区管理员手动授权。最终他被迫上传女儿哮喘发作的监控视频作为‘紧急凭证’，获得授权，但个人信用档案被永久标记。
  - 晚上8:00，林晓赶回物流仓库，维修最后一台机器人。在清理内存芯片时，发现一段未加密的对话日志，内容显示有市民计划在‘全民气候共识日’期间利用配送网络传播反对碳配额上调的手写传单。他望向窗外社区集会的灯光，陷入了沉默与抉择。
emotional_beat: 从清晨的焦虑与紧迫，到午间的互助温暖与无奈，再到傍晚的绝望与牺牲，最后在深夜的发现中陷入沉思与道德挣扎——情绪曲线呈‘V’形，在药房高潮处跌入谷底，在深夜发现中缓慢回升至复杂、沉重的抉择感。
obstacle1: 林晓必须在完成系统派发的六台机器人维修任务（维持生计）与为女儿取得急需的哮喘药（维持生命健康）之间分配有限的时间和信用资源；系统不断制造障碍（AI巡检、药房AI、处方验证），而人情网络（独居老人、老医生）则提供非正规的解决方案，两者形成对抗。
