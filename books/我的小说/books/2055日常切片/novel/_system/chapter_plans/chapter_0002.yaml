chapter: 2
goal: 展现维修工林晓在系统规则与人性需求之间的日常博弈；通过一次紧急维修和取药任务，揭示AI系统高效背后的僵化与漏洞，以及底层居民如何利用非正式关系（人情、互助积分）在缝隙中生存。
conflict: 林晓必须在完成系统派发的六台机器人维修任务（维持生计）与为女儿取得急需的哮喘药（维持生命健康）之间分配有限的时间和信用资源；系统（AI巡检、药房AI、处方验证）不断制造障碍，而人情网络（独居老人、老医生）则提供非正规的解决方案，两者形成对抗。
climax: 傍晚药房，林晓手持非正式渠道获得的电子凭据，却被药房AI以“跨区处方无效”拒绝出药。他必须在15分钟内找到参加线上听证会的社区管理员获得手动授权，否则凭据失效，女儿今晚将无药可用。最终他被迫上传女儿的隐私监控视频作为“紧急凭证”，换取授权，但个人信用档案被永久标记。
cost: 林晓的个人信用档案被添加“非常规数据使用”备注，未来可能影响他申请更高级别的工作或贷款；他上传了女儿哮喘发作的隐私监控视频，该数据被AI系统永久记录，家庭隐私进一步被系统侵蚀。
hook: 深夜，林晓在维修最后一台机器人时，发现其内存芯片中残留了一段未加密的对话日志，内容显示有市民计划在“全民气候共识日”期间，利用配送网络传播反对碳配额上调的手写传单。他望向窗外社区集会的灯光，陷入了沉默与抉择。
scenes:
  - 场景1：清晨的故障与无人机盘查（林晓被派往维修第一台脑机接口污染的机器人，机器人失控冲入生态保护区，触发AI巡检盘查，留下违规记录，时间被延误）。
  - 场景2：取药受阻与人情网络（林晓在药房得知处方药断货，利用维修途中帮独居老人修空气滤芯的人情，老人用互助积分帮他联系到老医生，通过非正式视频通话获得替代药的电子凭据）。
  - 场景3：药房最后的15分钟（林晓赶到药房，凭据被AI判定无效；他必须找到参加线上听证会的社区管理员，最终以上传女儿隐私视频为代价，换取手动授权）。
  - 场景4：深夜的发现与抉择（林晓修完最后一台机器人，发现内存中的反抗传单日志；回家看到女儿已服药睡下，妻子指着窗外社区集会灯光；他保存了日志，关掉工作App拉上窗帘）。
emotional_beat: 从早晨被系统刁难的压抑与焦虑，到利用人情网络获取希望的一丝温暖，再到药房被AI拒绝的绝望与愤怒，最终被迫牺牲隐私换取孩子健康的屈辱与苦涩，结尾在发现反抗信息时转为一种混杂着警惕、犹豫和微弱希望的复杂情绪。
obstacle1: 林晓必须在完成系统派发的六台机器人维修任务（维持生计）与为女儿取得急需的哮喘药（维持生命健康）之间分配有限的时间和信用资源；系统（AI巡检、药房AI、处方验证）不断制造障碍，而人情网络（独居老人、老医生）则提供非正规的解决方案，两者形成对抗。
ending: 深夜，林晓在维修最后一台机器人时，发现其内存芯片中残留了一段未加密的对话日志，内容显示有市民计划在“全民气候共识日”期间，利用配送网络传播反对碳配额上调的手写传单。他望向窗外社区集会的灯光，陷入了沉默与抉择。
