chapter: 4
goal: 展现维修工林晓在系统规则与人性需求之间的日常博弈；通过一次紧急维修和取药任务，揭示AI系统高效背后的僵化与漏洞，以及底层居民如何利用非正式关系在缝隙中生存。
conflict: 林晓必须在完成系统派发的六台机器人维修任务（维持生计）与为女儿取得急需的哮喘药（维持生命健康）之间分配有限的时间和信用资源；系统不断制造障碍（AI巡检、药房AI、处方验证），而人情网络（独居老人、老医生）则提供非正规的解决方案，两者形成对抗。
climax: 傍晚药房，林晓手持非正式渠道获得的电子凭据，却被药房AI以‘跨区处方无效’拒绝出药。他必须在15分钟内找到参加线上听证会的社区管理员获得手动授权，否则凭据失效，女儿今晚将无药可用。最终他被迫上传女儿的隐私监控视频作为‘紧急凭证’，换取授权，但个人信用档案被永久标记。
cost: 林晓的个人信用档案被添加‘非常规数据使用’备注，未来可能影响他申请更高级别的工作或贷款；他上传了女儿哮喘发作的隐私监控视频，该数据被AI系统永久记录，家庭隐私进一步被系统侵蚀。
hook: 深夜，林晓在维修最后一台机器人时，发现其内存芯片中残留了一段未加密的对话日志，内容显示有市民计划在‘全民气候共识日’期间，利用配送网络传播反对碳配额上调的手写传单。他望向窗外社区集会的灯光，陷入了沉默与抉择。
scenes:
  - 清晨，林晓被系统推送的今日任务清单唤醒——六台故障机器人维修，其中三台位于光域边缘的物流枢纽。他同时收到女儿学校的AI通知：因近期空气质量指数恶化，建议为患有哮喘的女儿储备紧急药物。
  - 上午至下午，林晓在维修途中利用旧关系网联系独居老人赵师傅，通过非正式渠道获得一张‘跨区电子处方凭据’。但系统AI巡检多次打断他的工作，因‘路径偏差’被扣减数字贡献点。
  - 傍晚，林晓赶往灰域边缘的药房，药房AI以‘跨区处方无效’拒绝出药。他必须在15分钟内联系上正在参加线上听证会的社区管理员老周。最终，他被迫将女儿哮喘发作的监控视频上传作为‘紧急凭证’，获得手动授权，但信用档案被永久标记。
  - 深夜，林晓在维修最后一台物流机器人时，发现其内存芯片中残留了一段未加密的对话日志，内容涉及‘全民气候共识日’的传单传播计划。他望向窗外社区集会的灯光，陷入沉默与抉择。
emotional_beat: 从清晨的焦虑与紧迫，到午间的奔波与压抑，傍晚达到绝望与妥协的顶点，深夜则转为疲惫后的震惊与沉思——一种被系统推向道德边缘的钝痛感，最后在发现秘密时转为不安与犹豫的复杂情绪。
obstacle1: 林晓必须在完成系统派发的六台机器人维修任务（维持生计）与为女儿取得急需的哮喘药（维持生命健康）之间分配有限的时间和信用资源；系统不断制造障碍（AI巡检、药房AI、处方验证），而人情网络（独居老人、老医生）则提供非正规的解决方案，两者形成对抗。
