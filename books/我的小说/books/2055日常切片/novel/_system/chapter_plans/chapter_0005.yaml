chapter: 5
goal: 展现维修工林晓在系统规则与人性需求之间的日常博弈；通过一次紧急维修和取药任务，揭示AI系统高效背后的僵化与漏洞，以及底层居民如何利用非正式关系在缝隙中生存。
conflict: 林晓必须在完成系统派发的六台机器人维修任务（维持生计）与为女儿取得急需的哮喘药（维持生命健康）之间分配有限的时间和信用资源；系统不断制造障碍（AI巡检、药房AI、处方验证），而人情网络（独居老人、老医生）则提供非正规的解决方案，两者形成对抗。
climax: 傍晚药房，林晓手持非正式渠道获得的电子凭据，却被药房AI以‘跨区处方无效’拒绝出药。他必须在15分钟内找到参加线上听证会的社区管理员获得手动授权，否则凭据失效，女儿今晚将无药可用。最终他被迫上传女儿的隐私监控视频作为‘紧急凭证’，换取授权，但个人信用档案被永久标记。
cost: 林晓的个人信用档案被添加‘非常规数据使用’备注，未来可能影响他申请更高级别的工作或贷款；他上传了女儿哮喘发作的隐私监控视频，该数据被AI系统永久记录，家庭隐私进一步被系统侵蚀。
hook: 深夜，林晓在维修最后一台机器人时，发现其内存芯片中残留了一段未加密的对话日志，内容显示有市民计划在‘全民气候共识日’期间，利用配送网络传播反对碳配额上调的手写传单。他望向窗外社区集会的灯光，陷入了沉默与抉择。
scenes:
  - 清晨，林晓的系统终端推送今日任务列表：六台机器人维修，信用点预算仅够覆盖女儿三天药量。他必须在出发前决定是先抢修高价值订单（换取积分升级工具），还是先绕道去老医生处取药。
  - 中午，林晓在灰域边缘维修一台故障的物流机器人时，偶遇独居老人王伯。王伯因脑机接口老化被系统标记为‘低效节点’，家中能源配额被削减。林晓用自己攒的信用点帮王伯临时充值，换取王伯提供的‘非正式处方’——一位退休老医生的手写电子凭据。
  - 下午，林晓在光域网点维修一台安保机器人，系统突然派发‘紧急巡检’任务，要求他15分钟内到达指定地点，否则扣分。他被迫中断维修，赶往巡检点，却发现是AI误报——一台故障的交通信号灯。系统不承认错误，仍记录他‘任务未完成’。
  - 傍晚，林晓赶到药房，药房AI扫描凭据后拒绝出药：‘跨区处方无效，需社区管理员手动授权。’他联系社区管理员，对方正在参加线上听证会无法脱身。林晓必须在15分钟内解决，否则凭据过期。他最终选择上传女儿昨晚哮喘发作的监控视频作为‘紧急凭证’，系统授权，但信用档案被永久标记。
  - 深夜，林晓维修最后一台机器人——一台被遗弃在暗域边缘的旧型号。拆解时，他在内存芯片中发现一段未加密的对话日志：一群市民在密谋利用配送网络在‘全民气候共识日’传播手写传单，反对碳配额上调。他望向窗外，社区广场上正举行‘和谐集会’，灯光璀璨，人群整齐划一地鼓掌。他攥紧芯片，陷入沉默。
emotional_beat: 从清晨的务实焦虑（计算信用点与时间的紧张），到中午的温暖连接（王伯的互助与信任），再到下午的挫败与无奈（系统的不公与僵化），傍晚的绝望与牺牲（被迫出卖隐私的屈辱），最终在深夜抵达一种沉静的觉醒与抉择——当系统试图渗透一切，人性在缝隙中仍然在寻找抵抗的方式。
obstacle1: 林晓必须在完成系统派发的六台机器人维修任务（维持生计）与为女儿取得急需的哮喘药（维持生命健康）之间分配有限的时间和信用资源；系统不断制造障碍（AI巡检、药房AI、处方验证），而人情网络（独居老人、老医生）则提供非正规的解决方案，两者形成对抗。
ending: 深夜，林晓在维修最后一台机器人时，发现其内存芯片中残留了一段未加密的对话日志，内容显示有市民计划在‘全民气候共识日’期间，利用配送网络传播反对碳配额上调的手写传单。他望向窗外社区集会的灯光，陷入了沉默与抉择。
