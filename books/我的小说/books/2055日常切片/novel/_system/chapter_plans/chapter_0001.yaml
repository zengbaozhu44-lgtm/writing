chapter: 1
goal: 通过外卖员张北在2055年夏季清晨的日常，呈现一个AI全面渗透、系统精密优化个体生活的未来世界，并埋下个体自主性与系统性控制之间张力的种子。
conflict: 张北在系统预设的‘最优’生活轨迹（智能唤醒、AI规划路线、健康评分）中，感受到的便利与隐约的窒息感之间的内在冲突；以及他作为个体，面对系统规则（碳中和积分、健康评分）时的无力与微小反抗。
climax: 张北在老旧小区与‘数字隔离户’老人的短暂交谈——老人因儿子‘生物芯片过敏’失业，靠社区低保度日。这次对话像一面镜子，让张北第一次清晰看到‘系统之外’的代价，也让他对自己被量化的生活产生明确的疑虑。
cost: 张北的‘健康评分’因昨日送餐超时被系统扣除0.5分，直接影响到他当日订单分配的优先级。这是个体在系统规则下付出的、可量化的生存代价。
hook: 张北在晨光中骑上平衡车，系统推送的第一单地址，正是那位‘数字隔离户’老人所在的社区。他看了一眼健康评分面板上跳动的数字，突然感到，这个清晨的唤醒，或许不只是生物节律的循环。
scenes:
  - 场景1：智能卧室的唤醒。2055年夏，北京清晨5:00，恒温系统自动调节至26℃。张北被智能床垫的生物节律闹钟唤醒，系统推送‘今日健康评分’与‘最优配送路线’。妻子李薇的全息屏备课场景，女儿小鹿的脑机接口学习终端。社区公告：因‘碳中和积分’不足，本月电费将上浮15%。
  - 场景2：配送的序曲与裂缝。张北骑上公司配发的电动平衡车，途经空无一人的自动驾驶出租车队。他接到第一单：送药至老旧小区，客户是一位拒绝安装脑机接口的老人。与老人的简短交谈中，他得知了‘生物芯片过敏’与‘数字隔离户’的存在。离开时，健康评分因昨日超时被扣0.5分的通知弹出。
emotional_beat: 从清晨被系统唤醒的平静与习惯性接受，到配送途中目睹无人车队时的轻微异样感，再到与老人交谈后的震惊与自省，最后以查看健康评分时的警觉与隐忧收尾。情绪曲线呈现‘微澜-涟漪-浪头-退潮’的克制波动。
obstacle1: 张北在系统预设的‘最优’生活轨迹（智能唤醒、AI规划路线、健康评分）中，感受到的便利与隐约的窒息感之间的内在冲突；以及他作为个体，面对系统规则（碳中和积分、健康评分）时的无力与微小反抗。
ending: 张北在晨光中骑上平衡车，系统推送的第一单地址，正是那位‘数字隔离户’老人所在的社区。他看了一眼健康评分面板上跳动的数字，突然感到，这个清晨的唤醒，或许不只是生物节律的循环。
