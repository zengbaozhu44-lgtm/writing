character: 苏珊
goals:
  surface: 在AI主导的福利分配系统中，为被边缘化的老年人、低收入群体争取更多人文关怀资源
  hidden: 通过推动社区自治，证明即使患有神经退行性疾病、拒绝脑机接口治疗，她依然能保持自主性与价值，对抗系统对‘缺陷者’的隐性淘汰逻辑
fears:
