  - 她的抗争只是杯水车薪，最终被系统同化或边缘化
  - 因拒绝脑机接口而逐渐被社会视为‘低效个体’，被亲友和社区抛弃
bottom_line: 绝不利用联络员权限私下修改居民数据或收受好处
