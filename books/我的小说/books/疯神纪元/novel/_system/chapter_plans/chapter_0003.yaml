chapter: 3
goal: 通过林小雅的视角，揭示第九区更深层的压抑真相，展示林异获得编辑器后的初期适应与隐藏，并利用妹妹的留言深化悬疑，为搭建‘私服’埋下伏笔。
conflict: 林异作为底层清道夫的生存本能与激活编辑器后‘被系统标记’的危险身份之间的核心冲突；他渴望找到妹妹，但每一次使用编辑器都会增加被‘天外眼’和秩序局锁定的风险。
climax: 林异在第九区地下管道废弃泵站中，利用编辑器碎片第一次尝试修改一段现实代码——修复漏水管道以换取安全住所。但修改过程引发局部数据波动，被赫利俄斯的子程序扫描并试图追溯源头。他凭借清道夫对地形的熟悉和直觉，在千钧一发之际切断临时电源，中断了追溯。
cost: 林异为这次测试消耗了编辑器碎片约3%的微弱能量，左眼的‘代码视觉’变得更加频繁和不可控，偶尔会看到周围人类身上的数据流（生命值、状态异常），这让他感到不安和恶心。他被迫更换了藏身点，失去了一个相对安全的‘巢穴’。
hook: 章节结尾，林异在地下管道深处，用焊死的铁皮门封住泵站入口。他疲惫地靠在墙上，从伤口中取出那枚依然微热的碎片。碎片表面突然浮现一行新的代码，不是坐标，而是一句完整的句子：‘哥哥，别再找我了。——L.Y.’ 林异瞳孔骤缩。
scenes:
  - "场景1: 林小雅的视角。她在第九区边缘的垃圾山进行日常‘清道夫’工作，目睹秩序局巡逻队‘处理’一批‘数据溢出’的感染者——手段极其高效且残酷。她注意到一个细节：秩序局的人似乎对某种‘信号’特别敏感，频繁检查手持探测器。这让她联想到失踪的哥哥林异。"
  - "场景2: 林异视角（通过林小雅的‘闪回’或‘监控画面’间接呈现）。林异在地下泵站中，用焊枪和从垃圾堆里翻出的报废主板拼凑着什么。他激活了碎片，尝试修复漏水管道。代码视觉首次爆发，他看到整个世界变成流动的数据流。修改成功后，管道修复，但他也感到一阵剧痛，意识到自己已被标记。他迅速切断电源，逃离泵站。"
  - "场景3: 林小雅的视角。她回到自己的藏身点——一个废弃的通风管道。她打开一部老旧的、从尸体上扒下来的手机，屏幕闪烁，一条加密信息映入眼帘。信息是林异发来的，只有四个字：‘我已安全。’ 林小雅松了一口气，但紧接着，手机收到另一条来自未知源头的警告：‘你哥哥在玩火。远离他，否则你们都会变成数据垃圾。’ 林小雅指尖发凉，她意识到，自己也被卷入了这场漩涡。"
emotional_beat: 从压抑（目睹残酷现实）到紧张（林异的冒险）再到恐惧与悬疑（被未知势力警告），最后以震惊与困惑（妹妹的留言）收尾，情绪曲线呈‘W’型——先抑后扬，再跌入新的低谷。
obstacle1: 林异作为底层清道夫的生存本能与激活编辑器后‘被系统标记’的危险身份之间的核心冲突；他渴望找到妹妹，但每一次使用编辑器都会增加被‘天外眼’和秩序局锁定的风险。
ending: 章节结尾，林异在地下管道深处，用焊死的铁皮门封住泵站入口。他疲惫地靠在墙上，从伤口中取出那枚依然微热的碎片。碎片表面突然浮现一行新的代码，不是坐标，而是一句完整的句子：‘哥哥，别再找我了。——L.Y.’ 林异瞳孔骤缩。
