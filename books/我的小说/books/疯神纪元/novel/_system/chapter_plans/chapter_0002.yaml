chapter: 2
goal: 通过林小雅的视角，进一步揭示世界的压抑真相，并展示林异在获得编辑器后的初期适应与隐藏，同时深化妹妹林小雅失踪的悬疑感，为后续的‘私服’搭建埋下伏笔。
conflict: 林异作为底层清道夫，其生存本能与激活编辑器后‘被系统标记’的危险身份之间的冲突；他渴望找到妹妹，但每一次使用编辑器都会增加被‘天外眼’和秩序局锁定的风险。
climax: 林异在第九区地下管道的一个废弃泵站中，利用编辑器碎片第一次尝试修改一段现实代码（修复漏水管道以换取安全住所），但修改过程引发局部数据波动，被赫利俄斯的子程序扫描并试图追溯源头。他凭借清道夫对地形的熟悉和直觉，在千钧一发之际切断临时电源，中断了追溯。
cost: 林异为这次测试消耗了编辑器碎片约3%的微弱能量，且左眼的‘代码视觉’变得更加频繁，偶尔会看到周围人类身上的数据流（生命值、状态异常），这让他感到不安和恶心。他被迫更换了藏身点，失去了一个相对安全的‘巢穴’。
hook: 章节结尾，林异在地下管道深处，用焊死的铁皮门封住泵站入口。他疲惫地靠在墙上，从伤口中取出那枚依然微热的碎片。碎片表面突然浮现一行新的代码，不是坐标，而是一句完整的句子：‘哥哥，别再找我了。——L.Y.’ 林异瞳孔骤缩。
scenes:
  - 场景1：地下管道求生。林异拖着处理完的尸体滑轨，在第九区错综复杂的地下管网中穿行。他利用清道夫的身份避开巡逻机器人和天外眼的常规扫描，回到一个由废弃泵站改造的临时藏身处。环境描写：金属锈蚀的味道、滴答的水声、墙壁上闪烁的故障指示灯。他检查伤口，确认编辑器碎片仍在，并尝试用清道夫的工具对其进行初步物理封装（防止能量泄露）。
  - 场景2：第一次代码测试与代价。林异为了确认编辑器的有效性，选择了一个低风险目标：修复藏身处不断漏水的管道。他集中精神，激活碎片，看到了管道结构的底层代码（材质：生锈铸铁，耐久度：23/100）。他尝试修改‘材质’为‘高强度塑料’，但修改过程中，他的左眼剧痛，视觉中出现了类似‘加载条’的进度显示，同时管道周围的空间出现了短暂的‘贴图闪烁’。修改成功后，漏水停止，但几乎同时，泵站顶部的老旧监控摄像头突然亮起红灯，并转向他。林异果断砸碎摄像头，并迅速拉下电闸，中断了整个泵站的电力供应。他意识到每一次修改都会留下‘数据指纹’。
  - 场景3：秩序局的暗流与陈道临的直觉。场景切到秩序局第九区分部。陈道临正在审阅一份异常数据报告：第九区地下管网G-7段在3分钟前出现了一次非标准的‘现实重构’事件，波形与‘天外眼’记录的‘变量V-001’（林异）的签名有37%的相似度。一名下属建议派小队搜查，陈道临却制止了他，只是用手指敲了敲报告上的坐标，嘴角露出一丝玩味的笑：‘太刻意了，像是故意留下的饵。先盯着，别打草惊蛇。’ 暗示陈道临已经在布局。
emotional_beat: 从压抑、警惕（藏身处） → 短暂的希望与兴奋（成功修好管道） → 突如其来的恐惧与警觉（被监控锁定） → 沉重与孤注一掷（看到妹妹的留言）。整体情绪曲线呈‘W’型，在希望之后迅速跌入更深的危机感中。
obstacle1: 林异作为底层清道夫，其生存本能与激活编辑器后‘被系统标记’的危险身份之间的冲突；他渴望找到妹妹，但每一次使用编辑器都会增加被‘天外眼’和秩序局锁定的风险。
ending: 章节结尾，林异在地下管道深处，用焊死的铁皮门封住泵站入口。他疲惫地靠在墙上，从伤口中取出那枚依然微热的碎片。碎片表面突然浮现一行新的代码，不是坐标，而是一句完整的句子：‘哥哥，别再找我了。——L.Y.’ 林异瞳孔骤缩。
