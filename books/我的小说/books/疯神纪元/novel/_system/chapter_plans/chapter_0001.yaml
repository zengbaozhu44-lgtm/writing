chapter: 1
goal: 建立压抑的赛博末世世界观，引入主角林异的底层身份与日常，并让他获得改变命运的核心道具——'源码编辑器'，同时埋下妹妹林小雅的伏笔。
conflict: 林异作为最底层的清道夫，在完成危险任务中发现了超越其认知的'数据溢出'变异体，这与他想要隐藏自己、苟且偷生的生存法则相冲突；同时，处理尸体的常规工作与'天外眼'监控下的高压环境构成外部冲突。
climax: 林异在清道夫腐烂的尸体中发现发光的'源代码编辑器'碎片，并因警报声和痛苦意外激活它，亲眼目睹世界底层代码的瞬间——他看到天空的贴图、人体的数据流、以及一行指向妹妹的坐标代码。
cost: 林异因激活编辑器时泄露的思维波，被'天外眼'标记，他平静的底层生活彻底打破，从此踏上逃亡与反抗的不归路；同时，他因窥见真相而精神受创，左眼开始间歇性看到世界的代码形态。
hook: 林异将编辑器碎片藏入断臂伤口，拖着尸体滑轨消失在黑暗中。头顶的'天外眼'扫描光束扫过他刚才站立的位置，停留了0.3秒——比平时多了0.2秒。他回头，看到自己的影子在墙上扭曲成一个他从未见过的符号：林小雅的名字缩写'LY'。
scenes:
  - 场景1：第九区的雨夜与清道夫的日常
  - 场景2：发现变异体与编辑器碎片
emotional_beat: 从麻木压抑（日常）→ 警觉紧张（发现异常）→ 震惊与恐惧（发现编辑器与真相）→ 绝望中燃起一丝希望（得到妹妹线索）→ 重归压抑但暗藏决心的平静
obstacle1: 林异作为最底层的清道夫，在完成危险任务中发现了超越其认知的'数据溢出'变异体，这与他想要隐藏自己、苟且偷生的生存法则相冲突；同时，处理尸体的常规工作与'天外眼'监控下的高压环境构成外部冲突。
ending: 林异将编辑器碎片藏入断臂伤口，拖着尸体滑轨消失在黑暗中。头顶的'天外眼'扫描光束扫过他刚才站立的位置，停留了0.3秒——比平时多了0.2秒。他回头，看到自己的影子在墙上扭曲成一个他从未见过的符号：林小雅的名字缩写'LY'。
