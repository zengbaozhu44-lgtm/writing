character: 博士
goals:
  surface: 为林异的“玩家”军团解析神性数据，制造装备和道具，推动实验进程
  hidden: 利用林异提供的资源，完成“造神”实验——将神性数据与人类意识融合，创造真正的“神级生物”，以此证明自己的理论，甚至取代林异成为新世界的造物主
