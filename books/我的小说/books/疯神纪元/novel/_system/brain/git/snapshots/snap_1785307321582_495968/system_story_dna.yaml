pitch: 这是一个孤独的骗子，在世界的废墟上，操纵着一群快乐的疯子，向着冷漠的神明发起的最后叛逆。
genre: 规则怪谈
core_hook: 第九区的雨总是带着机油味。林异拽着处理尸体的滑轨，在黑暗中穿行，他是一个“清道夫”，也是这座城市最底层的垃圾工。今晚的任务很特别：处理一个“数据溢出”的变异体。然而，在清道夫腐烂的尸体中，他发现了一个发光的、脉动的碎片——一个能改变现实的“源代码编辑器”。他还没来得及分析，警报声就在头顶炸响。不是为了警察，而是为了“天外眼”。在痛苦中，他无意中激活了编辑器，看到了世界的真相：一切都是代码。为了生存
reader: 16-35岁，喜欢末世、反乌托邦、智斗、暗黑风格、高概念网文读者
commercial_direction: 类似《诡秘之主》的智斗风格，结合《疯狂的麦克斯》末世感，主打“智商碾压”和“反套路”爽点。
estimated_length: 200-300万字（长篇连载）
main_conflict: “唯一的变量（林异）”与“系统的常态（天外眼）”之间的权限战争。 林异试图用“私服（玩家）”侵蚀“官服（现实）”，不断攻陷规则节点，提升版本上限；而世界系统（赫利俄斯）试图清除病毒，秩序局（陈道临）试图物理断网。这是一场数据层面对抗与物理层面追杀的双线博弈。
main_question: |-
  最想知道三个问题：
  “这游戏还能怎么玩？”（期待感升级）
  第一卷只是“丧尸潮”，读者迫切想看林异如何开放“新版本”。他们会期待更离谱的职业技能（如黑客修改现实）、更宏大的副本（如攻打秩序局大楼）、以及玩家如何去“卡”更高级神明的BUG。
  “林异会不会穿帮？”（紧张感维持）
  陈道临已经盯上了，赫利俄斯已经出手了。读者想看林异如何在下一卷中，利用更高级的“谎言”去圆上一个“谎言”。特别是当陈道临和林异正面对峙时，那种“在刀尖上跳踢踏舞”的刺激感。
  “妹妹到底在哪？这世界的真相是什么？”（好奇心钩子）
  第19章妹妹的留言是一个巨大的钩子。读者不再只满足于看玩家闹腾，他们开始关心主线：圣所是什么？编辑器是不是一个陷阱？ 这种悬疑感会驱使他们点开第二卷，去探究世界观更深层的秘密。
power_fantasy: 上帝视角爽：看着玩家像傻子一样冲向神明，却意外打出了“降维打击”的效果，林异作为幕后操盘手掌控全局。 规则碾压爽：LV2的玩家靠机制（滑铲、卡BUG）干翻LV4的神明。这是一种“凡人智商凌驾于神性数值”的爽快。 养成爽：从破屋服务器到建立白塔，从100个炮灰到第四天灾军团。
ending_direction: 林异攻陷“天外眼”核心，将赫利俄斯“格式化”或“收编”，将世界彻底重写为“开放世界”，玩家与人类共存，但他成为了新的“造物主”，孤独地守望这片数据星空。
theme: “认知即现实”。 只要有人敢于观测、敢于定义，虚无的混沌就能变为坚实的现实。歌颂在荒谬的世界中，用荒谬（游戏）去对抗命运的勇气。
audience: 追求深度剧情、智斗元素、反传统主角设定的网文爱好者，偏好暗黑、高概念、成人向故事。
title: 疯神纪元
