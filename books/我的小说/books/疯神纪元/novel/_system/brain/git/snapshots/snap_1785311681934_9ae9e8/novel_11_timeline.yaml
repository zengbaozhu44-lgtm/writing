days:
  - day: 1
    time: 00:00
    events:
      - 建立 POV（林小雅）当下目标：建立压抑的赛博末世世界观，引入主角林异的底层身份与日常，并让他获得改变命运的核心道具——'源码编辑器'，同时埋下妹妹林小雅的伏笔。
      - 克服阻碍：林异作为最底层的清道夫，在完成危险任务中发现了超越其认知的'数据溢出'变异体，这与他想要隐藏自己、苟且偷生的生存法则相冲突；同时，处理尸体的常规工作与'天外眼'监控下的高压环境构成外部冲突。
      - 林异在清道夫腐烂的尸体中发现发光的'源代码编辑器'碎片，并因警报声和痛苦意外激活它，亲眼目睹世界底层代码的瞬间——他看到天空的贴图、人体的数据流、以及一行指向妹妹的坐标代码。
      - 林异将编辑器碎片藏入断臂伤口，拖着尸体滑轨消失在黑暗中。头顶的'天外眼'扫描光束扫过他刚才站立的位置，停留了0.3秒——比平时多了0.2秒。他回头，看到自己的影子在墙上扭曲成一个他从未见过的符号：林小雅的名字缩写'LY'。
    characters_present:
      - 林小雅
    chapter: 1
  - day: 1
    time: 00:00
    events:
      - 建立 POV（林小雅）当下目标：通过林小雅的视角，进一步揭示世界的压抑真相，并展示林异在获得编辑器后的初期适应与隐藏，同时深化妹妹林小雅失踪的悬疑感，为后续的‘私服’搭建埋下伏笔。
      - 克服阻碍：林异作为底层清道夫，其生存本能与激活编辑器后‘被系统标记’的危险身份之间的冲突；他渴望找到妹妹，但每一次使用编辑器都会增加被‘天外眼’和秩序局锁定的风险。
      - 林异在第九区地下管道的一个废弃泵站中，利用编辑器碎片第一次尝试修改一段现实代码（修复漏水管道以换取安全住所），但修改过程引发局部数据波动，被赫利俄斯的子程序扫描并试图追溯源头。他凭借清道夫对地形的熟悉和直觉，在千钧一发之际切断临时电源，中断了追溯。
      - 章节结尾，林异在地下管道深处，用焊死的铁皮门封住泵站入口。他疲惫地靠在墙上，从伤口中取出那枚依然微热的碎片。碎片表面突然浮现一行新的代码，不是坐标，而是一句完整的句子：‘哥哥，别再找我了。——L.Y.’ 林异瞳孔骤缩。
    characters_present:
      - 林小雅
    chapter: 2
