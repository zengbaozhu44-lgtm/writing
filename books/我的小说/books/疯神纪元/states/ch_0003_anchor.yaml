  tailExcerpt: 人回答。 碎片表面开始出现裂纹。 林小雅站起来，膝盖顶到焊死的铁皮门。门缝外是泵站入口——三十秒路程。 她没动。 裂纹从碎片边缘蔓延到中心，那行字碎成光点，重新组合。 新坐标。 不是管道，不是泵站。 是她家。 林小雅的手停在半空。呼吸很轻。
