  tailExcerpt: 焊花灭了。 那人站起来，转身。 脸藏在面罩后面。 但林小雅认得那个动作—— 他摘下左手的手套。 露出手腕内侧那道疤。 她的疤。 七岁那年摔的。 “哥？” 门外的身影顿了一下。 然后举起焊枪，对准了门锁的位置。 不是要开门。 是要把锁眼焊死。
