  tailExcerpt: 第五遍。 她的影子站起来。 不是她站起来的。她的身体还蹲着，墙上的轮廓却已经立直，朝通道深处走去。影子的手腕上多了一道裂口——像第二只手的轮廓，正从她的影子里生长出来。 “还有两秒。” 她只有一个选择。 跟着影子走。 还是等第六遍光束过来。
